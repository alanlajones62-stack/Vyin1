<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vyin · Mensajes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           CHAT MOBILE - ESTILOS COMPLETOS
        ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #fff;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        /* ===== HEADER ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            height: 52px;
            min-height: 52px;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.2), rgba(219, 39, 119, 0.2), transparent);
            opacity: 0.5;
        }

        .chat-header .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .chat-header .back-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.08); }

        .chat-header .title {
            font-weight: 700;
            font-size: 17px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .title i { color: #c084fc; }

        .chat-header .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-header .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .chat-header .icon-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.08); }

        /* ===== CHAT CONTAINER ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 52px);
            background: #0a0a1a;
            position: relative;
        }

        /* ===== CONVERSATIONS LIST ===== */
        .conversations-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .conversations-header {
            padding: 12px 16px 8px;
            flex-shrink: 0;
        }
        .conversations-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .conversations-header h2 i { color: #c084fc; }

        .search-conversations {
            padding: 8px 16px 12px;
            flex-shrink: 0;
        }
        .search-conversations input {
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .search-conversations input::placeholder { color: rgba(255,255,255,0.2); }
        .search-conversations input:focus {
            outline: none;
            border-color: #c084fc;
            background: rgba(255,255,255,0.08);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 12px 80px;
        }
        .conversations-list::-webkit-scrollbar { width: 0; }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 14px;
            margin-bottom: 2px;
            position: relative;
        }
        .conversation-item:active { transform: scale(0.97); }
        .conversation-item:hover { background: rgba(255,255,255,0.03); }
        .conversation-item.active {
            background: rgba(192, 132, 252, 0.08);
        }

        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(192, 132, 252, 0.15);
            flex-shrink: 0;
            background: #1a1a2e;
        }

        .conversation-info { flex: 1; min-width: 0; }
        .conversation-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conversation-name .name-with-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-online { background-color: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.3); }
        .status-offline { background-color: #6b7280; }

        .conversation-time {
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .conversation-last-message {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .conversation-last-message .is-own { color: rgba(192,132,252,0.3); font-size: 11px; margin-right: 4px; }

        .unread-badge {
            background: linear-gradient(135deg, #c084fc, #db2777);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
            margin-left: 4px;
        }

        /* ===== MESSAGES PANEL ===== */
        .messages-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #0a0a1a;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            animation: slideIn 0.3s ease;
        }
        .messages-panel.active {
            display: flex;
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .messages-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .messages-header .back-chat-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .messages-header .back-chat-btn:active { transform: scale(0.88); }

        .messages-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(192, 132, 252, 0.15);
            cursor: pointer;
            flex-shrink: 0;
            background: #1a1a2e;
        }

        .messages-header-info { flex: 1; min-width: 0; }
        .messages-header-name {
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .messages-header-name:hover { color: #c084fc; }
        .messages-header-status {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
        }
        .messages-header-status .status-dot-small {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-indicator {
            font-size: 12px;
            color: #c084fc;
            font-style: italic;
            display: none;
            margin-top: 1px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .messages-container::-webkit-scrollbar { width: 0; }

        .message {
            display: flex;
            max-width: 82%;
            animation: messageIn 0.25s ease;
        }
        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(8px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message-own { align-self: flex-end; }
        .message-other { align-self: flex-start; }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            max-width: 100%;
            font-size: 14px;
            line-height: 1.5;
        }
        .message-own .message-bubble {
            background: linear-gradient(135deg, #c084fc, #db2777);
            border-bottom-right-radius: 4px;
        }
        .message-other .message-bubble {
            background: rgba(255,255,255,0.06);
            border-bottom-left-radius: 4px;
        }

        .message-content { 
            font-size: 14px; 
            line-height: 1.5; 
            color: #fff;
        }
        .message-content a { 
            color: #c084fc; 
            text-decoration: none; 
            border-bottom: 1px dashed rgba(192,132,252,0.3);
        }

        .message-time {
            font-size: 9px;
            color: rgba(255,255,255,0.25);
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .message-read { color: #c084fc; font-size: 9px; }
        .delete-message {
            opacity: 0;
            margin-left: 6px;
            cursor: pointer;
            font-size: 10px;
            color: rgba(255,107,107,0.5);
            transition: opacity 0.2s;
        }
        .message:hover .delete-message { opacity: 1; }

        /* ===== STORY PREVIEW ===== */
        .story-preview-card { margin-top: 6px; }
        .story-preview {
            display: flex;
            gap: 10px;
            background: rgba(192,132,252,0.08);
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(192,132,252,0.06);
        }
        .story-preview:hover { background: rgba(192,132,252,0.12); }
        .story-preview-thumb {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background: linear-gradient(135deg, #c084fc, #db2777);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .story-preview-thumb i { font-size: 18px; color: #fff; }
        .story-preview-info { flex: 1; min-width: 0; }
        .story-preview-title { font-weight: 600; font-size: 13px; }
        .story-preview-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
        .story-preview-link { font-size: 10px; color: #c084fc; margin-top: 2px; }

        /* ===== INPUT ===== */
        .messages-input {
            padding: 10px 12px 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .messages-input input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .messages-input input::placeholder { color: rgba(255,255,255,0.2); }
        .messages-input input:focus {
            outline: none;
            border-color: #c084fc;
            background: rgba(255,255,255,0.08);
        }

        .messages-input .emoji-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: rgba(255,255,255,0.3);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .messages-input .emoji-btn:active { transform: scale(0.88); }

        .messages-input .send-btn {
            background: linear-gradient(135deg, #c084fc, #db2777);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .messages-input .send-btn:active { transform: scale(0.88); }
        .messages-input .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: rgba(255,255,255,0.2);
            padding: 40px 20px;
        }
        .empty-state i { font-size: 48px; color: rgba(192,132,252,0.1); margin-bottom: 12px; }
        .empty-state h3 { font-size: 18px; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
        .empty-state p { font-size: 13px; color: rgba(255,255,255,0.12); }

        .empty-state-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.15);
            height: 100%;
        }
        .empty-state-chat i { font-size: 48px; color: rgba(192,132,252,0.08); margin-bottom: 12px; }
        .empty-state-chat h3 { font-size: 16px; color: rgba(255,255,255,0.2); margin-bottom: 4px; }
        .empty-state-chat p { font-size: 13px; color: rgba(255,255,255,0.08); }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: rgba(255,255,255,0.1);
        }
        .loading-spinner i { font-size: 24px; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: toastFade 2.8s ease;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 12px 48px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            pointer-events: none;
        }
        .toast.error { border-left: 3px solid #ff4444; }
        .toast.success { border-left: 3px solid #22c55e; }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.95); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(0.95); }
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {
            .conversation-item { padding: 10px 12px; }
            .conversation-avatar { width: 42px; height: 42px; }
            .message { max-width: 88%; }
            .chat-header .title { font-size: 15px; }
        }

        @media (max-width: 380px) {
            .conversation-item { padding: 8px 10px; }
            .conversation-avatar { width: 36px; height: 36px; }
            .conversation-name { font-size: 13px; }
            .conversation-last-message { font-size: 12px; }
            .message { max-width: 92%; }
            .message-bubble { font-size: 13px; padding: 8px 12px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .chat-header { height: 40px; min-height: 40px; padding: 6px 12px; }
            .chat-container { height: calc(100dvh - 40px); }
            .messages-header { padding: 8px 12px; }
            .messages-header-avatar { width: 32px; height: 32px; }
            .messages-input { padding: 6px 10px 8px; }
            .messages-input input { padding: 6px 12px; font-size: 13px; }
            .messages-input .emoji-btn,
            .messages-input .send-btn { width: 32px; height: 32px; font-size: 14px; }
            .messages-container { padding: 8px 12px; gap: 4px; }
            .message-bubble { padding: 6px 10px; font-size: 13px; }
            .conversation-item { padding: 6px 10px; }
            .conversation-avatar { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="chat-header">
        <button class="back-btn" onclick="window.location.href='/feed.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="title">
            <i class="fas fa-comments"></i> Mensajes
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="window.location.href='/feed.html'">
                <i class="fas fa-home"></i>
            </button>
        </div>
    </header>

    <!-- CHAT CONTAINER -->
    <div class="chat-container">
        
        <!-- CONVERSACIONES -->
        <div class="conversations-panel" id="conversationsPanel">
            <div class="conversations-header">
                <h2><i class="fas fa-comment-dots"></i> Conversaciones</h2>
            </div>
            <div class="search-conversations">
                <input type="text" id="searchConversations" placeholder="Buscar conversaciones..." />
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Cargando...</div>
            </div>
        </div>

        <!-- MESSAGES PANEL -->
        <div class="messages-panel" id="messagesPanel">
            <!-- Header dinámico -->
            <div class="messages-header" id="messagesHeader">
                <button class="back-chat-btn" id="backChatBtn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <img class="messages-header-avatar" id="chatAvatar" src="" alt="" />
                <div class="messages-header-info">
                    <div class="messages-header-name" id="chatName">Usuario</div>
                    <div class="messages-header-status" id="chatStatus">
                        <span class="status-dot-small status-offline"></span>
                        <span>Desconectado</span>
                    </div>
                    <div class="typing-indicator" id="typingIndicator">
                        <i class="fas fa-pencil-alt"></i> Escribiendo...
                    </div>
                </div>
            </div>

            <!-- Mensajes -->
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state-chat">
                    <i class="fas fa-comment"></i>
                    <h3>No hay mensajes</h3>
                    <p>Envía el primer mensaje</p>
                </div>
            </div>

            <!-- Input -->
            <div class="messages-input">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" />
                <button class="emoji-btn" id="emojiBtn" onclick="openEmojiPicker()">
                    <i class="far fa-smile-wink"></i>
                </button>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- EMOJI OVERLAY -->
    <div id="emojiOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:30000;align-items:center;justify-content:center;padding:20px;">
        <div style="background:#12122a;border-radius:20px;max-width:400px;width:100%;max-height:80vh;overflow:hidden;border:1px solid rgba(192,132,252,0.1);">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.06);">
                <span style="font-weight:600;font-size:16px;color:#c084fc;"><i class="far fa-smile-wink"></i> Emojis</span>
                <button onclick="closeEmojiPicker()" style="background:rgba(255,255,255,0.05);border:none;width:32px;height:32px;border-radius:50%;color:rgba(255,255,255,0.3);font-size:16px;cursor:pointer;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="emojiGrid" style="padding:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:60vh;overflow-y:auto;">
                <!-- Emojis generados por JS -->
            </div>
        </div>
    </div>

    <!-- SOCKET.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <!-- SCRIPTS -->
    <script type="module">
        // ============================================================
        // CHAT MOBILE - COMPLETO
        // ============================================================

        import { getToken, getCurrentUser, showToast as authShowToast } from './auth.js';

        const API_URL = window.location.origin;

        let currentUser = null;
        let currentConversation = null;
        let conversations = [];
        let messages = [];
        let socket = null;
        let messageInput = null;
        let isLoadingMore = false;
        let hasMoreMessages = true;
        let nextOffset = 0;
        const MESSAGES_PER_PAGE = 30;

        let conversationsListEl = document.getElementById('conversationsList');
        let messagesContainerEl = document.getElementById('messagesContainer');
        let messagesPanelEl = document.getElementById('messagesPanel');
        let typingTimeout = null;
        let isTyping = false;
        let userStatuses = new Map();

        // ============================================================
        // SHOW TOAST
        // ============================================================
        function showToast(message, isError = false) {
            if (typeof authShowToast === 'function') {
                authShowToast(message, isError);
                return;
            }
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            toast.innerHTML = `<i class="fas fa-${isError ? 'exclamation-triangle' : 'info-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2800);
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffHours = Math.floor((now - date) / 3600000);
            if (diffHours < 24) return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            if (diffHours < 48) return 'Ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function formatTimeAgo(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMins = Math.floor((now - date) / 60000);
            const diffHours = Math.floor((now - date) / 3600000);
            const diffDays = Math.floor((now - date) / 86400000);
            if (diffMins < 1) return 'Ahora';
            if (diffMins < 60) return `Hace ${diffMins} min`;
            if (diffHours < 24) return `Hace ${diffHours} h`;
            if (diffDays === 1) return 'Ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'recientemente';
            const date = new Date(timestamp);
            const now = new Date();
            const diffMins = Math.floor((now - date) / 60000);
            const diffHours = Math.floor((now - date) / 3600000);
            const diffDays = Math.floor((now - date) / 86400000);
            if (diffMins < 1) return 'ahora mismo';
            if (diffMins < 60) return `hace ${diffMins} min`;
            if (diffHours < 24) return `hace ${diffHours} h`;
            if (diffDays === 1) return 'ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        // ============================================================
        // EMOJI PICKER
        // ============================================================
        const EMOJIS = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','💀','☠️','👻','👽','👾','🤖','💩','😺','😸','😹','😻','😼','😽','🙀','😿','😾'];

        function openEmojiPicker() {
            const overlay = document.getElementById('emojiOverlay');
            if (!overlay) return;
            
            const grid = document.getElementById('emojiGrid');
            if (grid && grid.children.length === 0) {
                grid.innerHTML = EMOJIS.map(e => 
                    `<span style="font-size:28px;cursor:pointer;text-align:center;padding:4px;border-radius:8px;transition:all 0.2s;hover:background:rgba(255,255,255,0.05);" onclick="insertEmoji('${e}')">${e}</span>`
                ).join('');
            }
            
            overlay.style.display = 'flex';
        }

        window.openEmojiPicker = openEmojiPicker;

        function closeEmojiPicker() {
            const overlay = document.getElementById('emojiOverlay');
            if (overlay) overlay.style.display = 'none';
        }
        window.closeEmojiPicker = closeEmojiPicker;

        window.insertEmoji = function(emoji) {
            if (messageInput) {
                const cursorPos = messageInput.selectionStart;
                const text = messageInput.value;
                messageInput.value = text.slice(0, cursorPos) + emoji + text.slice(cursorPos);
                messageInput.focus();
                const newCursorPos = cursorPos + emoji.length;
                messageInput.setSelectionRange(newCursorPos, newCursorPos);
                handleTyping();
            }
            closeEmojiPicker();
        };

        // ============================================================
        // FUNCIONES PRINCIPALES
        // ============================================================
        async function fetchUserInfo(userId) {
            const token = getToken();
            if (!token) return null;
            try {
                const res = await fetch(`${API_URL}/api/users/profile/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) return await res.json();
            } catch (error) { console.error('Error fetching user:', error); }
            return null;
        }

        async function fetchUserStatus(userId) {
            const token = getToken();
            if (!token) return { status: 'offline', lastSeen: null };
            try {
                const res = await fetch(`${API_URL}/api/users/status/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    userStatuses.set(userId, { status: data.status, lastSeen: data.lastSeen });
                    return data;
                }
            } catch (error) { console.error('Error fetching user status:', error); }
            return { status: 'offline', lastSeen: null };
        }

        function updateChatHeaderStatus(userId) {
            const statusEl = document.getElementById('chatStatus');
            const dot = statusEl?.querySelector('.status-dot-small');
            const text = statusEl?.querySelector('span:last-child');
            if (!statusEl || !dot || !text) return;
            
            const status = userStatuses.get(userId);
            if (status && status.status === 'online') {
                dot.className = 'status-dot-small status-online';
                text.textContent = 'En línea';
            } else {
                dot.className = 'status-dot-small status-offline';
                text.textContent = status?.lastSeen ? `Último visto ${formatLastSeen(status.lastSeen)}` : 'Desconectado';
            }
        }

        // ============================================================
        // CARGAR CONVERSACIONES
        // ============================================================
        async function loadConversations() {
            const token = getToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/chats/conversations`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    conversations = await res.json();
                    
                    const userIds = conversations.map(c => c.user.id);
                    if (userIds.length > 0) {
                        const statusRes = await fetch(`${API_URL}/api/users/status/batch`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userIds })
                        });
                        if (statusRes.ok) {
                            const statuses = await statusRes.json();
                            statuses.forEach(s => {
                                userStatuses.set(s.userId, { status: s.status, lastSeen: s.lastSeen });
                            });
                        }
                    }
                    
                    renderConversations();
                } else if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                }
            } catch (error) { console.error('Error cargando conversaciones:', error); }
        }

        function renderConversations() {
            if (!conversationsListEl) return;
            const searchTerm = document.getElementById('searchConversations')?.value.toLowerCase() || '';
            let filtered = conversations;
            if (searchTerm) {
                filtered = conversations.filter(c => 
                    c.user.fullName?.toLowerCase().includes(searchTerm) || 
                    c.user.username?.toLowerCase().includes(searchTerm)
                );
            }
            if (filtered.length === 0) {
                conversationsListEl.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.1);">
                        <i class="fas fa-comments" style="font-size:32px;display:block;margin-bottom:12px;opacity:0.3;"></i>
                        <span>No hay conversaciones</span>
                        <div style="font-size:12px;color:rgba(255,255,255,0.05);margin-top:4px;">Comienza a chatear con alguien</div>
                    </div>
                `;
                return;
            }
            conversationsListEl.innerHTML = filtered.map(conv => {
                const userStatus = userStatuses.get(conv.user.id) || { status: 'offline', lastSeen: null };
                const statusClass = userStatus.status === 'online' ? 'status-online' : 'status-offline';
                const isBlocked = conv.user.blocked || false;
                return `
                <div class="conversation-item ${currentConversation?.id === conv.user.id ? 'active' : ''}" onclick="selectConversation('${conv.user.id}')">
                    <img class="conversation-avatar" src="${conv.user.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(conv.user.fullName || 'U') + '&background=7c3aed&color=fff'}" 
                         onerror="this.src='https://ui-avatars.com/api/?name=' + encodeURIComponent('${conv.user.fullName || 'U'}') + '&background=7c3aed&color=fff'" loading="lazy" />
                    <div class="conversation-info">
                        <div class="conversation-name">
                            <div class="name-with-status">
                                <span class="status-dot ${statusClass}"></span>
                                <span>${isBlocked ? '🔒 Usuario no encontrado' : escapeHtml(conv.user.fullName || conv.user.username)}</span>
                            </div>
                            <span class="conversation-time">${formatTimeAgo(conv.lastMessage.timestamp)}</span>
                        </div>
                        <div class="conversation-last-message">
                            ${conv.lastMessage.fromMe ? '<span class="is-own">Tú:</span>' : ''}
                            ${escapeHtml(conv.lastMessage.content?.substring(0, 50) || '')}${(conv.lastMessage.content?.length || 0) > 50 ? '...' : ''}
                        </div>
                    </div>
                    ${conv.unreadCount > 0 ? `<div class="unread-badge">${conv.unreadCount > 9 ? '9+' : conv.unreadCount}</div>` : ''}
                </div>
            `}).join('');
        }

        // ============================================================
        // CARGAR MENSAJES
        // ============================================================
        async function loadMessages(userId, loadMore = false, offset = 0) {
            const token = getToken();
            if (!token) return;
            
            if (!loadMore) {
                messages = [];
                hasMoreMessages = true;
                nextOffset = 0;
            }
            
            try {
                const url = `${API_URL}/api/chats/messages/${userId}?limit=${MESSAGES_PER_PAGE}&offset=${offset}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const newMessages = await res.json();
                    if (loadMore) {
                        messages = [...newMessages.reverse(), ...messages];
                        hasMoreMessages = newMessages.length === MESSAGES_PER_PAGE;
                        nextOffset = offset + MESSAGES_PER_PAGE;
                    } else {
                        messages = newMessages;
                        hasMoreMessages = newMessages.length === MESSAGES_PER_PAGE;
                        nextOffset = MESSAGES_PER_PAGE;
                    }
                    renderMessages();
                    if (!loadMore) {
                        scrollToBottom();
                        markMessagesAsRead(userId);
                    }
                }
            } catch (error) {
                console.error('Error cargando mensajes:', error);
                if (!loadMore) showToast('❌ Error cargando mensajes', true);
            }
        }

        function renderMessages() {
            if (!messagesContainerEl) return;
            if (messages.length === 0) {
                messagesContainerEl.innerHTML = `
                    <div class="empty-state-chat">
                        <i class="fas fa-comment"></i>
                        <h3>No hay mensajes</h3>
                        <p>Envía el primer mensaje</p>
                    </div>
                `;
                return;
            }
            
            let messagesHtml = '';
            for (const msg of messages) {
                messagesHtml += `
                    <div class="message ${msg.isOwn ? 'message-own' : 'message-other'}" data-message-id="${msg.id}">
                        <div class="message-bubble">
                            <div class="message-content">${escapeHtml(msg.content)}</div>
                            <div class="message-time">
                                ${formatTime(msg.timestamp)}
                                ${msg.isOwn ? `<span class="message-read">${msg.read ? '✓✓' : '✓'}</span>` : ''}
                                ${msg.isOwn ? `<i class="fas fa-trash-alt delete-message" onclick="event.stopPropagation(); deleteMessage('${msg.id}')"></i>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            messagesContainerEl.innerHTML = messagesHtml;
        }

        function markMessagesAsRead(userId) {
            const token = getToken();
            if (!token) return;
            
            let updated = false;
            messages.forEach(msg => {
                if (!msg.isOwn && !msg.read) {
                    msg.read = true;
                    updated = true;
                }
            });
            if (updated) renderMessages();
            
            if (socket && socket.connected) {
                socket.emit('mark_messages_read', { withUserId: userId });
            }
            
            fetch(`${API_URL}/api/chats/conversations/${userId}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            }).catch(err => console.error('Error marking read:', err));
        }

        function scrollToBottom() {
            if (messagesContainerEl) {
                requestAnimationFrame(() => {
                    messagesContainerEl.scrollTop = messagesContainerEl.scrollHeight;
                });
            }
        }

        function setupInfiniteScroll() {
            if (!messagesContainerEl) return;
            messagesContainerEl.removeEventListener('scroll', handleScroll);
            messagesContainerEl.addEventListener('scroll', handleScroll);
        }
        
        function handleScroll() {
            if (!messagesContainerEl) return;
            if (messagesContainerEl.scrollTop === 0 && hasMoreMessages && !isLoadingMore && currentConversation) {
                isLoadingMore = true;
                const oldHeight = messagesContainerEl.scrollHeight;
                loadMessages(currentConversation.id, true, nextOffset).then(() => {
                    setTimeout(() => {
                        if (messagesContainerEl) {
                            const newHeight = messagesContainerEl.scrollHeight;
                            messagesContainerEl.scrollTop = newHeight - oldHeight;
                        }
                        isLoadingMore = false;
                    }, 100);
                });
            }
        }

        // ============================================================
        // SELECCIONAR CONVERSACIÓN
        // ============================================================
        window.selectConversation = async function(userIdOrObject) {
            let userId, userData;
            if (typeof userIdOrObject === 'string') {
                userId = userIdOrObject;
                const existingConv = conversations.find(c => c.user.id === userId);
                if (existingConv) userData = existingConv.user;
                else userData = await fetchUserInfo(userId);
                if (!userData) { showToast('❌ No se pudo cargar el usuario', true); return; }
            } else {
                userData = userIdOrObject;
                userId = userData.id;
            }
            
            currentConversation = { 
                id: userData.id, 
                fullName: userData.fullName, 
                username: userData.username, 
                avatar: userData.avatar 
            };
            
            await fetchUserStatus(userId);
            
            renderConversations();
            await loadMessages(userId, false, 0);
            showMessagesPanel();
            updateChatHeaderStatus(userId);
        };

        function showMessagesPanel() {
            if (!messagesPanelEl) return;
            messagesPanelEl.classList.add('active');
            
            // Actualizar header
            const avatar = document.getElementById('chatAvatar');
            const name = document.getElementById('chatName');
            const backBtn = document.getElementById('backChatBtn');
            
            if (avatar) {
                avatar.src = currentConversation?.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentConversation?.fullName || 'U') + '&background=7c3aed&color=fff';
                avatar.onerror = function() {
                    this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentConversation?.fullName || 'U') + '&background=7c3aed&color=fff';
                };
            }
            if (name) name.textContent = currentConversation?.fullName || currentConversation?.username || 'Usuario';
            if (backBtn) {
                backBtn.onclick = function() {
                    messagesPanelEl.classList.remove('active');
                    loadConversations();
                };
            }
            
            messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('keypress', (e) => { 
                    if (e.key === 'Enter' && !e.shiftKey) { 
                        e.preventDefault(); 
                        sendMessage(); 
                    } 
                });
                messageInput.addEventListener('input', handleTyping);
                messageInput.focus();
            }
            
            setupInfiniteScroll();
        }

        // ============================================================
        // ENVIAR MENSAJE
        // ============================================================
        window.sendMessage = async function() {
            if (!messageInput || !messageInput.value.trim() || !currentConversation) return;
            const content = messageInput.value.trim();
            messageInput.value = '';
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.disabled = true;
            
            const token = getToken();
            if (!token) { showToast('❌ Sesión expirada', true); return; }
            
            const tempId = 'temp_' + Date.now();
            const newMsg = { id: tempId, content, timestamp: new Date().toISOString(), isOwn: true, read: false };
            messages.push(newMsg);
            renderMessages();
            scrollToBottom();
            
            try {
                const res = await fetch(`${API_URL}/api/chats/messages/${currentConversation.id}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    const realMessage = await res.json();
                    const index = messages.findIndex(m => m.id === tempId);
                    if (index !== -1) messages[index] = realMessage;
                    renderMessages();
                    loadConversations();
                } else {
                    messages = messages.filter(m => m.id !== tempId);
                    renderMessages();
                    showToast('❌ Error al enviar mensaje', true);
                }
            } catch (error) {
                messages = messages.filter(m => m.id !== tempId);
                renderMessages();
                showToast('❌ Error de conexión', true);
            }
            if (sendBtn) sendBtn.disabled = false;
        };

        // ============================================================
        // ELIMINAR MENSAJE
        // ============================================================
        window.deleteMessage = async function(messageId) {
            const token = getToken();
            if (!token) return;
            try {
                const res = await fetch(`${API_URL}/api/chats/messages/${messageId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    messages = messages.filter(m => m.id !== messageId);
                    renderMessages();
                    loadConversations();
                    showToast('✅ Mensaje eliminado');
                }
            } catch (error) {
                console.error('Error eliminando mensaje:', error);
                showToast('❌ Error al eliminar', true);
            }
        };

        // ============================================================
        // TYPING
        // ============================================================
        function handleTyping() {
            if (!socket || !socket.connected || !currentConversation) return;
            if (typingTimeout) clearTimeout(typingTimeout);
            if (!isTyping && messageInput && messageInput.value.trim().length > 0) {
                isTyping = true;
                socket.emit('typing', { to: currentConversation.id, isTyping: true });
            }
            typingTimeout = setTimeout(() => {
                if (isTyping) {
                    isTyping = false;
                    socket.emit('typing', { to: currentConversation.id, isTyping: false });
                }
            }, 1000);
        }

        // ============================================================
        // SOCKET
        // ============================================================
        function initSocket() {
            const token = getToken();
            if (!token) return;
            
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            
            socket = io(API_URL, {
                auth: { token },
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });
            window.socket = socket;

            socket.on('connect', () => {
                console.log('🔌 Socket conectado en chat');
                if (currentUser) {
                    socket.emit('user_online', { page: 'chat' });
                }
            });

            socket.on('receive_message', (message) => {
                if (currentConversation && message.from === currentConversation.id) {
                    messages.push({ ...message, isOwn: false });
                    renderMessages();
                    scrollToBottom();
                    markMessagesAsRead(currentConversation.id);
                }
                loadConversations();
                if (message.from !== currentConversation?.id) {
                    showToast(`📩 Nuevo mensaje de ${message.fromName || 'alguien'}`);
                }
            });

            socket.on('message_sent', (message) => {
                const index = messages.findIndex(m => m.id === message.id);
                if (index !== -1) {
                    messages[index] = message;
                    renderMessages();
                }
            });

            socket.on('user_typing', (data) => {
                const indicator = document.getElementById('typingIndicator');
                if (indicator && currentConversation && data.from === currentConversation.id) {
                    indicator.style.display = data.isTyping ? 'block' : 'none';
                    if (data.isTyping) {
                        setTimeout(() => {
                            if (indicator && indicator.style.display === 'block') {
                                indicator.style.display = 'none';
                            }
                        }, 3000);
                    }
                }
            });

            socket.on('messages_read', (data) => {
                if (currentConversation && data.byUserId === currentConversation.id) {
                    let updated = false;
                    messages.forEach(msg => {
                        if (msg.isOwn && !msg.read) {
                            msg.read = true;
                            updated = true;
                        }
                    });
                    if (updated) renderMessages();
                }
                loadConversations();
            });

            socket.on('message_deleted', (data) => {
                messages = messages.filter(m => m.id !== data.messageId);
                renderMessages();
            });

            socket.on('conversations_update', () => {
                loadConversations();
            });

            socket.on('user_status_changed', (data) => {
                userStatuses.set(data.userId, { status: data.status, lastSeen: data.lastSeen });
                if (currentConversation && currentConversation.id === data.userId) {
                    updateChatHeaderStatus(data.userId);
                }
                renderConversations();
            });

            socket.on('disconnect', () => {
                console.log('🔌 Socket desconectado');
            });
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        async function init() {
            currentUser = getCurrentUser();
            if (!currentUser) {
                const token = getToken();
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }
                try {
                    const res = await fetch(`${API_URL}/api/users/profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) currentUser = await res.json();
                } catch (error) { console.error('Error cargando usuario:', error); }
            }

            const searchInput = document.getElementById('searchConversations');
            if (searchInput) {
                searchInput.addEventListener('input', () => renderConversations());
            }

            await loadConversations();
            initSocket();

            // Cerrar emoji overlay al hacer click fuera
            document.getElementById('emojiOverlay')?.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeEmojiPicker();
            });

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            if (userId) {
                setTimeout(async () => {
                    await selectConversation(userId);
                }, 500);
            }

            console.log('📱 Chat mobile inicializado');
        }

        // Exponer funciones globales
        window.selectConversation = selectConversation;
        window.sendMessage = sendMessage;
        window.deleteMessage = deleteMessage;

        document.addEventListener('DOMContentLoaded', init);
    </script>
