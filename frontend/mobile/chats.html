<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vyin · Mensajes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           CHAT MOBILE - OPTIMIZADO (SIN RE-RENDERIZADOS)
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #fff;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }

        /* ===== HEADER ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            height: 54px;
            min-height: 54px;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.3), rgba(219, 39, 119, 0.3), transparent);
            opacity: 0.5;
        }

        .chat-header .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .chat-header .back-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-header .title {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .title i {
            background: linear-gradient(135deg, #c084fc, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-header .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-header .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .chat-header .icon-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== CHAT CONTAINER ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 54px);
            background: #0a0a1a;
            position: relative;
        }

        /* ===== CONVERSATIONS LIST ===== */
        .conversations-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: rgba(10, 10, 26, 0.95);
        }

        .conversations-header {
            padding: 14px 16px 8px;
            flex-shrink: 0;
        }
        .conversations-header h2 {
            font-size: 17px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .conversations-header h2 i {
            background: linear-gradient(135deg, #c084fc, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 18px;
        }
        .conversations-header .subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            margin-left: 4px;
        }

        /* ===== CHAT TABS ===== */
        .chat-tabs {
            display: flex;
            padding: 0 12px;
            gap: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .chat-tab {
            flex: 1;
            padding: 10px 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            border-bottom: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .chat-tab.active {
            color: #fff;
            border-bottom-color: #c084fc;
        }

        .chat-tab:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-tab .tab-badge {
            background: #db2777;
            color: #fff;
            font-size: 9px;
            border-radius: 50%;
            padding: 1px 6px;
            min-width: 18px;
            text-align: center;
        }

        .search-conversations {
            padding: 8px 16px 14px;
            flex-shrink: 0;
            position: relative;
        }
        .search-conversations input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .search-conversations input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .search-conversations input:focus {
            outline: none;
            border-color: rgba(192, 132, 252, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        .search-conversations .search-icon {
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            pointer-events: none;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 12px 80px;
            scroll-behavior: smooth;
        }
        .conversations-list::-webkit-scrollbar { width: 0; }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 16px;
            margin-bottom: 2px;
            position: relative;
            will-change: transform;
        }
        .conversation-item:active {
            transform: scale(0.97);
        }
        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .conversation-item.active {
            background: rgba(192, 132, 252, 0.08);
            border: 1px solid rgba(192, 132, 252, 0.06);
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(192, 132, 252, 0.1);
            flex-shrink: 0;
            background: #1a1a2e;
        }
        .conversation-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .conversation-avatar-wrapper .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #0a0a1a;
        }
        .status-online { background-color: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.3); }
        .status-offline { background-color: #4b5563; }

        .conversation-info { flex: 1; min-width: 0; }
        .conversation-name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conversation-name .name-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .conversation-name .verified-icon {
            color: #c084fc;
            font-size: 12px;
        }

        .conversation-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            margin-left: 8px;
        }
        .conversation-last-message {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .conversation-last-message .is-own {
            color: rgba(192, 132, 252, 0.2);
            font-size: 11px;
            margin-right: 4px;
        }

        .unread-badge {
            background: linear-gradient(135deg, #c084fc, #db2777);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 7px;
            flex-shrink: 0;
            margin-left: 4px;
            box-shadow: 0 2px 12px rgba(192, 132, 252, 0.2);
        }

        .pending-badge {
            background: rgba(192, 132, 252, 0.15);
            color: #c084fc;
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .pending-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .pending-actions .btn-accept,
        .pending-actions .btn-reject {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .pending-actions .btn-accept {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .pending-actions .btn-accept:hover {
            background: #10b981;
            color: #fff;
        }

        .pending-actions .btn-reject {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .pending-actions .btn-reject:hover {
            background: #ef4444;
            color: #fff;
        }

        /* ===== MESSAGES PANEL ===== */
        .messages-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #0a0a1a;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 15;
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .messages-panel.active {
            display: flex;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .messages-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .messages-header .back-chat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .messages-header .back-chat-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.08);
        }

        .messages-header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(192, 132, 252, 0.15);
            cursor: pointer;
            flex-shrink: 0;
            background: #1a1a2e;
        }

        .messages-header-info { flex: 1; min-width: 0; }
        .messages-header-name {
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .messages-header-name:hover { color: #c084fc; }
        .messages-header-status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
        }
        .messages-header-status .status-dot-small {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .typing-indicator {
            font-size: 12px;
            color: #c084fc;
            font-style: italic;
            display: none;
            margin-top: 1px;
            animation: pulseText 1.2s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== MESSAGES CONTAINER ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            background: radial-gradient(ellipse at 50% 0%, rgba(192, 132, 252, 0.02), transparent 70%);
            overscroll-behavior: contain;
        }
        .messages-container::-webkit-scrollbar { 
            width: 3px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.15);
            border-radius: 10px;
        }

        /* ===== MESSAGE ===== */
        .message {
            display: flex;
            max-width: 82%;
            animation: messageIn 0.3s ease;
            margin-bottom: 2px;
            will-change: transform, opacity;
        }
        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message-own { align-self: flex-end; }
        .message-other { align-self: flex-start; }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
            max-width: 100%;
            font-size: 14px;
            line-height: 1.5;
        }
        .message-own .message-bubble {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 12px rgba(192, 132, 252, 0.15);
        }
        .message-other .message-bubble {
            background: rgba(255, 255, 255, 0.06);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .message-content {
            font-size: 14px;
            line-height: 1.5;
            color: #fff;
        }
        .message-content a {
            color: #c084fc;
            text-decoration: none;
            border-bottom: 1px dashed rgba(192, 132, 252, 0.3);
        }

        .message-time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .message-read {
            color: #c084fc;
            font-size: 9px;
        }
        .delete-message {
            opacity: 0;
            margin-left: 6px;
            cursor: pointer;
            font-size: 10px;
            color: rgba(255, 107, 107, 0.3);
            transition: opacity 0.2s;
        }
        .message:hover .delete-message {
            opacity: 1;
        }
        .delete-message:hover {
            color: #ff6b6b;
        }

        /* ===== DATE DIVIDER ===== */
        .date-divider {
            text-align: center;
            padding: 12px 0 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .date-divider span {
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ===== INPUT ===== */
        .messages-input {
            padding: 10px 12px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .messages-input input {
            flex: 1;
            padding: 11px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .messages-input input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .messages-input input:focus {
            outline: none;
            border-color: rgba(192, 132, 252, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .messages-input .send-btn {
            background: linear-gradient(135deg, #c084fc, #db2777);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(192, 132, 252, 0.2);
        }
        .messages-input .send-btn:active {
            transform: scale(0.88);
        }
        .messages-input .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 40px 20px;
        }
        .empty-state i {
            font-size: 56px;
            color: rgba(192, 132, 252, 0.05);
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.08);
        }

        .empty-state-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.1);
            height: 100%;
        }
        .empty-state-chat i {
            font-size: 48px;
            color: rgba(192, 132, 252, 0.05);
            margin-bottom: 12px;
        }
        .empty-state-chat h3 {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 4px;
        }
        .empty-state-chat p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.06);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.05);
            gap: 12px;
            font-size: 14px;
        }
        .loading-spinner i {
            font-size: 20px;
            color: #c084fc;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 10px 22px;
            border-radius: 50px;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: toastFade 2.8s ease;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            pointer-events: none;
        }
        .toast.error {
            border-left: 3px solid #ff4444;
        }
        .toast.success {
            border-left: 3px solid #22c55e;
        }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.95); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(0.95); }
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {
            .conversation-item { padding: 10px 12px; }
            .conversation-avatar { width: 44px; height: 44px; }
            .message { max-width: 88%; }
            .chat-header .title { font-size: 16px; }
            .messages-input input { font-size: 13px; padding: 9px 14px; }
            .messages-input .send-btn { width: 38px; height: 38px; font-size: 16px; }
        }

        @media (max-width: 380px) {
            .conversation-item { padding: 8px 10px; }
            .conversation-avatar { width: 36px; height: 36px; }
            .conversation-name { font-size: 13px; }
            .conversation-last-message { font-size: 12px; }
            .message { max-width: 92%; }
            .message-bubble { font-size: 13px; padding: 8px 12px; }
            .messages-input input { font-size: 12px; padding: 7px 12px; }
            .messages-input .send-btn { width: 34px; height: 34px; font-size: 14px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .chat-header { height: 42px; min-height: 42px; padding: 4px 12px; }
            .chat-container { height: calc(100dvh - 42px); }
            .messages-header { padding: 6px 12px; }
            .messages-header-avatar { width: 32px; height: 32px; }
            .messages-input { padding: 4px 10px 6px; }
            .messages-input input { padding: 5px 12px; font-size: 13px; }
            .messages-input .send-btn { width: 32px; height: 32px; font-size: 14px; }
            .messages-container { padding: 8px 12px; gap: 2px; }
            .message-bubble { padding: 6px 10px; font-size: 13px; }
            .conversation-item { padding: 4px 8px; }
            .conversation-avatar { width: 30px; height: 30px; }
            .conversations-header { padding: 8px 12px 4px; }
            .conversations-header h2 { font-size: 14px; }
            .search-conversations { padding: 4px 12px 8px; }
            .search-conversations input { padding: 6px 12px 6px 34px; font-size: 12px; }
            .chat-tab { font-size: 10px; padding: 6px 4px; }
        }

        /* ===== SCROLLBAR MEJORADA ===== */
        .messages-container::-webkit-scrollbar,
        .conversations-list::-webkit-scrollbar {
            width: 3px;
        }
        .messages-container::-webkit-scrollbar-track,
        .conversations-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb,
        .conversations-list::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.15);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb:hover,
        .conversations-list::-webkit-scrollbar-thumb:hover {
            background: rgba(192, 132, 252, 0.3);
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(192, 132, 252, 0.1);
            border-top-color: #c084fc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- HEADER -->
    <header class="chat-header">
        <button class="back-btn" onclick="window.location.href='/feed.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="title">
            <i class="fas fa-comment-dots"></i> Mensajes
        </div>
        <div class="header-right">
        </div>
    </header>

    <!-- CHAT CONTAINER -->
    <div class="chat-container">

        <!-- CONVERSACIONES -->
        <div class="conversations-panel" id="conversationsPanel">
            <div class="conversations-header">
                <h2>
                    <i class="fas fa-comment-dots"></i> Conversaciones
                    <span class="subtitle">· Tus chats</span>
                </h2>
            </div>

            <!-- TABS -->
            <div class="chat-tabs">
                <button class="chat-tab active" data-tab="active" onclick="switchChatTab('active')">
                    <i class="fas fa-comment"></i> Activos
                </button>
                <button class="chat-tab" data-tab="pending" onclick="switchChatTab('pending')">
                    <i class="fas fa-clock"></i> Pendientes
                    <span class="tab-badge" id="pendingCount">0</span>
                </button>
                <button class="chat-tab" data-tab="archived" onclick="switchChatTab('archived')">
                    <i class="fas fa-archive"></i> Archivados
                </button>
            </div>

            <div class="search-conversations">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchConversations" placeholder="Buscar conversaciones..." />
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-pulse"></i> Cargando conversaciones...
                </div>
            </div>
        </div>

        <!-- MESSAGES PANEL -->
        <div class="messages-panel" id="messagesPanel">
            <div class="messages-header" id="messagesHeader">
                <button class="back-chat-btn" id="backChatBtn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <img class="messages-header-avatar" id="chatAvatar" src="" alt="Avatar" />
                <div class="messages-header-info">
                    <div class="messages-header-name" id="chatName">Usuario</div>
                    <div class="messages-header-status" id="chatStatus">
                        <span class="status-dot-small status-offline"></span>
                        <span>Desconectado</span>
                    </div>
                    <div class="typing-indicator" id="typingIndicator">
                        <i class="fas fa-pencil-alt"></i> Escribiendo...
                    </div>
                </div>
            </div>

            <!-- Mensajes -->
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state-chat">
                    <i class="fas fa-comment-dots"></i>
                    <h3>No hay mensajes</h3>
                    <p>Envía el primer mensaje</p>
                </div>
            </div>

            <!-- Input -->
            <div class="messages-input">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" />
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- SOCKET.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <script type="module">
        // ============================================================
        // CHAT MOBILE - COMPLETO CON PERSISTENCIA Y SOLICITUDES
        // ============================================================

        import { getToken, getCurrentUser, showToast as authShowToast } from './auth.js';

        const API_URL = window.location.origin;

        let currentUser = null;
        let currentConversation = null;
        let conversations = { active: [], pending: [], archived: [] };
        let messages = [];
        let socket = null;
        let messageInput = null;
        let isLoadingMore = false;
        let hasMoreMessages = true;
        let nextOffset = 0;
        const MESSAGES_PER_PAGE = 30;
        let currentTab = 'active';

        let conversationsListEl = document.getElementById('conversationsList');
        let messagesContainerEl = document.getElementById('messagesContainer');
        let messagesPanelEl = document.getElementById('messagesPanel');
        let typingTimeout = null;
        let isTyping = false;
        let userStatuses = new Map();
        let scrollTimeout = null;
        let isInitialLoad = true;

        // ============================================================
        // 📦 PERSISTENCIA EN LOCALSTORAGE
        // ============================================================
        function saveChatState(userId) {
            if (!userId || messages.length === 0) return;
            try {
                const state = {
                    messages: messages,
                    scrollPosition: messagesContainerEl?.scrollTop || 0,
                    timestamp: Date.now(),
                    conversationStatus: currentConversation?.status || 'active'
                };
                localStorage.setItem(`chat_state_${userId}`, JSON.stringify(state));
            } catch (error) {
                console.error('Error guardando estado del chat:', error);
            }
        }

        function loadChatState(userId) {
            try {
                const data = localStorage.getItem(`chat_state_${userId}`);
                if (!data) return null;
                const state = JSON.parse(data);
                if (state && Date.now() - state.timestamp < 300000) {
                    return state;
                }
                return null;
            } catch (error) {
                console.error('Error cargando estado del chat:', error);
                return null;
            }
        }

        function clearChatState(userId) {
            if (userId) {
                localStorage.removeItem(`chat_state_${userId}`);
            }
        }

        // ============================================================
        // SHOW TOAST
        // ============================================================
        function showToast(message, isError = false) {
            if (typeof authShowToast === 'function') {
                authShowToast(message, isError);
                return;
            }
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            toast.innerHTML = `<i class="fas fa-${isError ? 'exclamation-triangle' : 'info-circle'}"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2800);
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffHours = Math.floor((now - date) / 3600000);
            if (diffHours < 24) return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            if (diffHours < 48) return 'Ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function formatTimeAgo(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMins = Math.floor((now - date) / 60000);
            const diffHours = Math.floor((now - date) / 3600000);
            const diffDays = Math.floor((now - date) / 86400000);
            if (diffMins < 1) return 'Ahora';
            if (diffMins < 60) return `Hace ${diffMins} min`;
            if (diffHours < 24) return `Hace ${diffHours} h`;
            if (diffDays === 1) return 'Ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'recientemente';
            const date = new Date(timestamp);
            const now = new Date();
            const diffMins = Math.floor((now - date) / 60000);
            const diffHours = Math.floor((now - date) / 3600000);
            const diffDays = Math.floor((now - date) / 86400000);
            if (diffMins < 1) return 'ahora mismo';
            if (diffMins < 60) return `hace ${diffMins} min`;
            if (diffHours < 24) return `hace ${diffHours} h`;
            if (diffDays === 1) return 'ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function getDateDivider(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) return 'Hoy';
            if (date.toDateString() === yesterday.toDateString()) return 'Ayer';
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.classList.toggle('active', show);
            }
        }

        // ============================================================
        // FUNCIONES PRINCIPALES
        // ============================================================
        async function fetchUserInfo(userId) {
            const token = getToken();
            if (!token) return null;
            try {
                const res = await fetch(`${API_URL}/api/users/profile/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) return await res.json();
            } catch (error) { console.error('Error fetching user:', error); }
            return null;
        }

        async function fetchUserStatus(userId) {
            const token = getToken();
            if (!token) return { status: 'offline', lastSeen: null };
            try {
                const res = await fetch(`${API_URL}/api/users/status/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    userStatuses.set(userId, { status: data.status, lastSeen: data.lastSeen });
                    return data;
                }
            } catch (error) { console.error('Error fetching user status:', error); }
            return { status: 'offline', lastSeen: null };
        }

        function updateChatHeaderStatus(userId) {
            const statusEl = document.getElementById('chatStatus');
            const dot = statusEl?.querySelector('.status-dot-small');
            const text = statusEl?.querySelector('span:last-child');
            if (!statusEl || !dot || !text) return;

            const status = userStatuses.get(userId);
            if (status && status.status === 'online') {
                dot.className = 'status-dot-small status-online';
                text.textContent = 'En línea';
            } else {
                dot.className = 'status-dot-small status-offline';
                text.textContent = status?.lastSeen ? `Último visto ${formatLastSeen(status.lastSeen)}` : 'Desconectado';
            }
        }

        // ============================================================
        // CAMBIAR TAB
        // ============================================================
        window.switchChatTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.chat-tab').forEach(el => el.classList.remove('active'));
            document.querySelector(`.chat-tab[data-tab="${tab}"]`)?.classList.add('active');
            renderConversations();
        };

        // ============================================================
        // CARGAR CONVERSACIONES
        // ============================================================
        async function loadConversations() {
            const token = getToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/chats/conversations`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    
                    conversations = {
                        active: data.active || [],
                        pending: data.pending || [],
                        archived: data.archived || []
                    };

                    // Actualizar contador de pendientes
                    const pendingCount = document.getElementById('pendingCount');
                    if (pendingCount) {
                        pendingCount.textContent = conversations.pending.length || '0';
                    }

                    // Cargar estados de usuarios
                    const allUserIds = [
                        ...conversations.active.map(c => c.user.id),
                        ...conversations.pending.map(c => c.user.id),
                        ...conversations.archived.map(c => c.user.id)
                    ];
                    
                    if (allUserIds.length > 0) {
                        const statusRes = await fetch(`${API_URL}/api/users/status/batch`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userIds: allUserIds })
                        });
                        if (statusRes.ok) {
                            const statuses = await statusRes.json();
                            statuses.forEach(s => {
                                userStatuses.set(s.userId, { status: s.status, lastSeen: s.lastSeen });
                            });
                        }
                    }

                    renderConversations();
                } else if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                }
            } catch (error) { 
                console.error('Error cargando conversaciones:', error);
                showToast('❌ Error cargando conversaciones', true);
            }
        }

        function renderConversations() {
            if (!conversationsListEl) return;
            
            const searchTerm = document.getElementById('searchConversations')?.value.toLowerCase() || '';
            
            // Obtener las conversaciones según la pestaña activa
            let allConversations = [];
            if (currentTab === 'active') allConversations = conversations.active || [];
            else if (currentTab === 'pending') allConversations = conversations.pending || [];
            else if (currentTab === 'archived') allConversations = conversations.archived || [];
            
            // Filtrar por búsqueda
            if (searchTerm) {
                allConversations = allConversations.filter(c =>
                    c.user.fullName?.toLowerCase().includes(searchTerm) ||
                    c.user.username?.toLowerCase().includes(searchTerm)
                );
            }
            
            if (allConversations.length === 0) {
                const emptyMessages = {
                    active: 'No hay conversaciones activas',
                    pending: 'No hay solicitudes de chat pendientes',
                    archived: 'No hay conversaciones archivadas'
                };
                conversationsListEl.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.08);">
                        <i class="fas fa-comments" style="font-size:36px;display:block;margin-bottom:12px;opacity:0.3;"></i>
                        <span style="font-size:14px;">${emptyMessages[currentTab] || 'No hay conversaciones'}</span>
                    </div>
                `;
                return;
            }
            
            conversationsListEl.innerHTML = allConversations.map(conv => {
                const userStatus = userStatuses.get(conv.user.id) || { status: 'offline', lastSeen: null };
                const statusClass = userStatus.status === 'online' ? 'status-online' : 'status-offline';
                const isActive = currentConversation?.id === conv.user.id;
                
                // Badge de solicitud pendiente
                let pendingBadge = '';
                let pendingActions = '';
                
                if (conv.isPending && currentTab === 'pending') {
                    pendingBadge = `<span class="pending-badge">Solicitud</span>`;
                    pendingActions = `
                        <div class="pending-actions">
                            <button class="btn-accept" onclick="event.stopPropagation(); window.acceptChatRequest('${conv.user.id}')">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="btn-reject" onclick="event.stopPropagation(); window.rejectChatRequest('${conv.user.id}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                }
                
                return `
                <div class="conversation-item ${isActive ? 'active' : ''}" onclick="window.selectConversation('${conv.user.id}')">
                    <div class="conversation-avatar-wrapper">
                        <img class="conversation-avatar" src="${conv.user.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(conv.user.fullName || 'U') + '&background=7c3aed&color=fff'}"
                             onerror="this.src='https://ui-avatars.com/api/?name=' + encodeURIComponent('${conv.user.fullName || 'U'}') + '&background=7c3aed&color=fff'" loading="lazy" />
                        <span class="status-dot ${statusClass}"></span>
                    </div>
                    <div class="conversation-info">
                        <div class="conversation-name">
                            <div class="name-text">
                                <span>${escapeHtml(conv.user.fullName || conv.user.username)}</span>
                                ${conv.user.isVerified ? '<i class="fas fa-check-circle verified-icon"></i>' : ''}
                                ${pendingBadge}
                            </div>
                            <span class="conversation-time">${formatTimeAgo(conv.lastMessage.timestamp)}</span>
                        </div>
                        <div class="conversation-last-message">
                            ${conv.lastMessage.fromMe ? '<span class="is-own">Tú:</span>' : ''}
                            ${escapeHtml(conv.lastMessage.content?.substring(0, 50) || '')}${(conv.lastMessage.content?.length || 0) > 50 ? '...' : ''}
                            ${conv.isPending ? ' <span style="color:#c084fc;font-size:10px;">· Solicitud de chat</span>' : ''}
                            ${conv.status === 'archived' ? ' <span style="color:rgba(255,255,255,0.15);font-size:10px;">· Archivado</span>' : ''}
                        </div>
                    </div>
                    ${conv.unreadCount > 0 ? `<div class="unread-badge">${conv.unreadCount > 9 ? '9+' : conv.unreadCount}</div>` : ''}
                    ${pendingActions}
                </div>
            `}).join('');
        }

        // ============================================================
        // ACEPTAR SOLICITUD DE CHAT
        // ============================================================
        window.acceptChatRequest = async function(userId) {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch(`${API_URL}/api/chats/conversations/${userId}/accept`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showToast('✅ Solicitud de chat aceptada');
                    loadConversations();
                    setTimeout(() => window.selectConversation(userId), 500);
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Error al aceptar solicitud', true);
                }
            } catch (error) {
                console.error('Error aceptando solicitud:', error);
                showToast('❌ Error al aceptar solicitud', true);
            }
        };

        // ============================================================
        // RECHAZAR SOLICITUD DE CHAT
        // ============================================================
        window.rejectChatRequest = async function(userId) {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch(`${API_URL}/api/chats/conversations/${userId}/reject`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showToast('❌ Solicitud de chat rechazada');
                    loadConversations();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Error al rechazar solicitud', true);
                }
            } catch (error) {
                console.error('Error rechazando solicitud:', error);
                showToast('❌ Error al rechazar solicitud', true);
            }
        };

        // ============================================================
        // CARGAR MENSAJES - CON CACHÉ LOCAL
        // ============================================================
        async function loadMessages(userId, loadMore = false, offset = 0) {
            const token = getToken();
            if (!token) return;

            // 🔥 INTENTAR CARGAR DESDE CACHÉ LOCAL
            if (!loadMore && !isInitialLoad) {
                const cached = loadChatState(userId);
                if (cached && cached.messages && cached.messages.length > 0) {
                    console.log(`📦 Cargando ${cached.messages.length} mensajes desde caché local`);
                    messages = cached.messages;
                    renderMessages();
                    if (cached.scrollPosition) {
                        setTimeout(() => {
                            messagesContainerEl.scrollTop = cached.scrollPosition;
                        }, 50);
                    }
                    if (currentConversation) {
                        currentConversation.status = cached.conversationStatus || 'active';
                    }
                    refreshMessagesInBackground(userId);
                    return;
                }
            }

            if (!loadMore) {
                messages = [];
                hasMoreMessages = true;
                nextOffset = 0;
                showLoading(true);
            }

            try {
                const url = `${API_URL}/api/chats/messages/${userId}?limit=${MESSAGES_PER_PAGE}&offset=${offset}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const newMessages = data.messages || [];
                    
                    // Guardar estado de la conversación
                    if (currentConversation) {
                        currentConversation.status = data.conversationStatus || 'active';
                        currentConversation.mutualFollow = data.mutualFollow || false;
                    }
                    
                    if (loadMore) {
                        const existingIds = new Set(messages.map(m => m.id));
                        const uniqueNew = newMessages.filter(m => !existingIds.has(m.id));
                        const oldScrollHeight = messagesContainerEl?.scrollHeight || 0;
                        const oldScrollTop = messagesContainerEl?.scrollTop || 0;
                        
                        messages = [...uniqueNew.reverse(), ...messages];
                        hasMoreMessages = data.hasMore || false;
                        nextOffset = offset + MESSAGES_PER_PAGE;
                        
                        renderMessages();
                        if (messagesContainerEl) {
                            requestAnimationFrame(() => {
                                const newScrollHeight = messagesContainerEl.scrollHeight;
                                messagesContainerEl.scrollTop = oldScrollTop + (newScrollHeight - oldScrollHeight);
                            });
                        }
                    } else {
                        messages = newMessages;
                        hasMoreMessages = data.hasMore || false;
                        nextOffset = MESSAGES_PER_PAGE;
                        renderMessages();
                        if (!isInitialLoad) {
                            scrollToBottom();
                        }
                        markMessagesAsRead(userId);
                        // Guardar en caché local
                        saveChatState(userId);
                    }
                }
            } catch (error) {
                console.error('Error cargando mensajes:', error);
                if (!loadMore) showToast('❌ Error cargando mensajes', true);
            }
            if (!loadMore) {
                showLoading(false);
                isInitialLoad = false;
            }
        }

        // ============================================================
        // ACTUALIZAR MENSAJES EN SEGUNDO PLANO
        // ============================================================
        async function refreshMessagesInBackground(userId) {
            try {
                const token = getToken();
                if (!token) return;
                const url = `${API_URL}/api/chats/messages/${userId}?limit=${MESSAGES_PER_PAGE}&offset=0`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const newMessages = data.messages || [];
                    if (newMessages.length > messages.length) {
                        messages = newMessages;
                        renderMessages();
                        saveChatState(userId);
                    }
                }
            } catch (error) {
                // Silencioso
            }
        }

        // ============================================================
        // 📝 RENDERIZAR MENSAJES (SOLO PARA CARGA INICIAL)
        // ============================================================
        function renderMessages() {
            if (!messagesContainerEl) return;
            
            const scrollTop = messagesContainerEl.scrollTop;
            const scrollHeight = messagesContainerEl.scrollHeight;
            const clientHeight = messagesContainerEl.clientHeight;
            const wasNearBottom = scrollHeight - (scrollTop + clientHeight) < 100;

            if (messages.length === 0) {
                // Mostrar mensaje según estado de la conversación
                let emptyMessage = 'No hay mensajes';
                let emptySubMessage = 'Envía el primer mensaje';
                
                if (currentConversation?.status === 'pending') {
                    emptyMessage = '💬 Solicitud de chat pendiente';
                    emptySubMessage = 'Espera a que el usuario acepte tu solicitud';
                } else if (currentConversation?.status === 'archived') {
                    emptyMessage = '📦 Conversación archivada';
                    emptySubMessage = 'Sigue al usuario para reactivar el chat';
                }
                
                messagesContainerEl.innerHTML = `
                    <div class="empty-state-chat">
                        <i class="fas fa-comment-dots"></i>
                        <h3>${emptyMessage}</h3>
                        <p>${emptySubMessage}</p>
                    </div>
                `;
                return;
            }

            let messagesHtml = '';
            let lastDate = '';

            for (const msg of messages) {
                const msgDate = getDateDivider(msg.timestamp);
                if (msgDate !== lastDate) {
                    messagesHtml += `
                        <div class="date-divider"><span>${msgDate}</span></div>
                    `;
                    lastDate = msgDate;
                }

                const messageId = msg.id || `temp_${Date.now()}_${Math.random()}`;
                messagesHtml += `
                    <div class="message ${msg.isOwn ? 'message-own' : 'message-other'}" data-message-id="${messageId}">
                        <div class="message-bubble">
                            <div class="message-content">${escapeHtml(msg.content)}</div>
                            <div class="message-time">
                                ${formatTime(msg.timestamp)}
                                ${msg.isOwn ? `<span class="message-read">${msg.read ? '✓✓' : '✓'}</span>` : ''}
                                ${msg.isOwn ? `<i class="fas fa-trash-alt delete-message" onclick="event.stopPropagation(); window.deleteMessage('${messageId}')"></i>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            requestAnimationFrame(() => {
                messagesContainerEl.innerHTML = messagesHtml;
                
                if (wasNearBottom) {
                    requestAnimationFrame(() => {
                        messagesContainerEl.scrollTop = messagesContainerEl.scrollHeight;
                    });
                } else {
                    const newScrollHeight = messagesContainerEl.scrollHeight;
                    const ratio = scrollTop / (scrollHeight || 1);
                    messagesContainerEl.scrollTop = ratio * newScrollHeight;
                }
            });
        }

        // ============================================================
        // ➕ AÑADIR UN SOLO MENSAJE SIN RE-RENDERIZAR TODO
        // ============================================================
        function appendSingleMessage(msg) {
            if (!messagesContainerEl) return;

            if (messagesContainerEl.querySelector('.empty-state-chat')) {
                renderMessages();
                return;
            }

            let lastDate = '';
            const existingDateDividers = messagesContainerEl.querySelectorAll('.date-divider');
            if (existingDateDividers.length > 0) {
                const lastDivider = existingDateDividers[existingDateDividers.length - 1];
                if (lastDivider) {
                    lastDate = lastDivider.textContent.trim();
                }
            }

            const msgDate = getDateDivider(msg.timestamp);
            let html = '';
            
            if (msgDate !== lastDate) {
                html += `
                    <div class="date-divider"><span>${msgDate}</span></div>
                `;
            }

            const messageId = msg.id || `temp_${Date.now()}_${Math.random()}`;
            html += `
                <div class="message ${msg.isOwn ? 'message-own' : 'message-other'}" data-message-id="${messageId}" style="animation: messageIn 0.3s ease;">
                    <div class="message-bubble">
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-time">
                            ${formatTime(msg.timestamp)}
                            ${msg.isOwn ? `<span class="message-read">${msg.read ? '✓✓' : '✓'}</span>` : ''}
                            ${msg.isOwn ? `<i class="fas fa-trash-alt delete-message" onclick="event.stopPropagation(); window.deleteMessage('${messageId}')"></i>` : ''}
                        </div>
                    </div>
                </div>
            `;

            messagesContainerEl.insertAdjacentHTML('beforeend', html);
            
            requestAnimationFrame(() => {
                messagesContainerEl.scrollTop = messagesContainerEl.scrollHeight;
            });
        }

        // ============================================================
        // 🔄 ACTUALIZAR UN SOLO MENSAJE
        // ============================================================
        function updateSingleMessage(tempId, realMessage) {
            const msgEl = document.querySelector(`.message[data-message-id="${tempId}"]`);
            if (msgEl) {
                const contentEl = msgEl.querySelector('.message-content');
                const timeEl = msgEl.querySelector('.message-time');
                if (contentEl) contentEl.textContent = realMessage.content;
                if (timeEl) {
                    timeEl.innerHTML = `
                        ${formatTime(realMessage.timestamp)}
                        <span class="message-read">${realMessage.read ? '✓✓' : '✓'}</span>
                        <i class="fas fa-trash-alt delete-message" onclick="event.stopPropagation(); window.deleteMessage('${realMessage.id}')"></i>
                    `;
                }
                msgEl.dataset.messageId = realMessage.id;
            }
        }

        // ============================================================
        // 🗑️ ELIMINAR UN SOLO MENSAJE
        // ============================================================
        function removeSingleMessage(messageId) {
            const msgEl = document.querySelector(`.message[data-message-id="${messageId}"]`);
            if (msgEl) {
                msgEl.remove();
                if (messagesContainerEl.querySelectorAll('.message').length === 0) {
                    messagesContainerEl.innerHTML = `
                        <div class="empty-state-chat">
                            <i class="fas fa-comment-dots"></i>
                            <h3>No hay mensajes</h3>
                            <p>Envía el primer mensaje</p>
                        </div>
                    `;
                }
            }
        }

        function markMessagesAsRead(userId) {
            const token = getToken();
            if (!token) return;

            let updated = false;
            messages.forEach(msg => {
                if (!msg.isOwn && !msg.read) {
                    msg.read = true;
                    updated = true;
                }
            });
            if (updated) renderMessages();

            if (socket && socket.connected) {
                socket.emit('mark_messages_read', { withUserId: userId });
            }

            fetch(`${API_URL}/api/chats/conversations/${userId}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            }).catch(err => console.error('Error marking read:', err));
        }

        function scrollToBottom() {
            if (messagesContainerEl) {
                requestAnimationFrame(() => {
                    messagesContainerEl.scrollTop = messagesContainerEl.scrollHeight;
                });
            }
        }

        function setupInfiniteScroll() {
            if (!messagesContainerEl) return;
            messagesContainerEl.removeEventListener('scroll', handleScroll);
            messagesContainerEl.addEventListener('scroll', handleScroll, { passive: true });
        }

        function handleScroll() {
            if (!messagesContainerEl) return;
            if (scrollTimeout) clearTimeout(scrollTimeout);

            scrollTimeout = setTimeout(() => {
                if (messagesContainerEl.scrollTop === 0 && hasMoreMessages && !isLoadingMore && currentConversation) {
                    isLoadingMore = true;
                    loadMessages(currentConversation.id, true, nextOffset).then(() => {
                        isLoadingMore = false;
                    });
                }
                if (currentConversation) {
                    saveChatState(currentConversation.id);
                }
            }, 200);
        }

        // ============================================================
        // SELECCIONAR CONVERSACIÓN
        // ============================================================
        window.selectConversation = async function(userIdOrObject) {
            let userId, userData;
            if (typeof userIdOrObject === 'string') {
                userId = userIdOrObject;
                // Buscar en todas las categorías
                const allConvs = [...conversations.active, ...conversations.pending, ...conversations.archived];
                const existingConv = allConvs.find(c => c.user.id === userId);
                if (existingConv) userData = existingConv.user;
                else userData = await fetchUserInfo(userId);
                if (!userData) { showToast('❌ No se pudo cargar el usuario', true); return; }
            } else {
                userData = userIdOrObject;
                userId = userData.id;
            }

            // Guardar estado del chat actual antes de cambiar
            if (currentConversation && messages.length > 0) {
                saveChatState(currentConversation.id);
            }

            currentConversation = {
                id: userData.id,
                fullName: userData.fullName,
                username: userData.username,
                avatar: userData.avatar,
                status: 'active'
            };

            await fetchUserStatus(userId);

            renderConversations();
            isInitialLoad = true;
            await loadMessages(userId, false, 0);
            showMessagesPanel();
            updateChatHeaderStatus(userId);
        };

        function showMessagesPanel() {
            if (!messagesPanelEl) return;
            messagesPanelEl.classList.add('active');

            const avatar = document.getElementById('chatAvatar');
            const name = document.getElementById('chatName');
            const backBtn = document.getElementById('backChatBtn');

            if (avatar) {
                avatar.src = currentConversation?.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentConversation?.fullName || 'U') + '&background=7c3aed&color=fff';
                avatar.onerror = function() {
                    this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentConversation?.fullName || 'U') + '&background=7c3aed&color=fff';
                };
            }
            if (name) name.textContent = currentConversation?.fullName || currentConversation?.username || 'Usuario';
            if (backBtn) {
                backBtn.onclick = function() {
                    if (currentConversation) {
                        saveChatState(currentConversation.id);
                    }
                    messagesPanelEl.classList.remove('active');
                    loadConversations();
                };
            }

            messageInput = document.getElementById('messageInput');
            if (messageInput) {
                const newInput = messageInput.cloneNode(true);
                messageInput.parentNode.replaceChild(newInput, messageInput);
                messageInput = newInput;

                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        window.sendMessage();
                    }
                });
                messageInput.addEventListener('input', handleTyping);
                setTimeout(() => messageInput.focus(), 300);
            }

            setupInfiniteScroll();
        }

        // ============================================================
        // ENVIAR MENSAJE - CON RENDERIZADO OPTIMIZADO
        // ============================================================
        window.sendMessage = async function() {
            if (!messageInput || !messageInput.value.trim() || !currentConversation) return;
            const content = messageInput.value.trim();
            messageInput.value = '';
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.disabled = true;

            const token = getToken();
            if (!token) { showToast('❌ Sesión expirada', true); return; }

            const tempId = 'temp_' + Date.now();
            const newMsg = {
                id: tempId,
                content,
                timestamp: new Date().toISOString(),
                isOwn: true,
                read: false
            };
            messages.push(newMsg);
            
            appendSingleMessage(newMsg);

            try {
                const res = await fetch(`${API_URL}/api/chats/messages/${currentConversation.id}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    const realMessage = await res.json();
                    const index = messages.findIndex(m => m.id === tempId);
                    if (index !== -1) {
                        messages[index] = realMessage;
                        updateSingleMessage(tempId, realMessage);
                        saveChatState(currentConversation.id);
                    }
                    loadConversations();
                } else {
                    messages = messages.filter(m => m.id !== tempId);
                    removeSingleMessage(tempId);
                    showToast('❌ Error al enviar mensaje', true);
                }
            } catch (error) {
                messages = messages.filter(m => m.id !== tempId);
                removeSingleMessage(tempId);
                showToast('❌ Error de conexión', true);
            }
            if (sendBtn) sendBtn.disabled = false;
        };

        // ============================================================
        // ELIMINAR MENSAJE
        // ============================================================
        window.deleteMessage = async function(messageId) {
            const token = getToken();
            if (!token) return;
            try {
                const res = await fetch(`${API_URL}/api/chats/messages/${messageId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    messages = messages.filter(m => m.id !== messageId);
                    removeSingleMessage(messageId);
                    loadConversations();
                    if (currentConversation) {
                        saveChatState(currentConversation.id);
                    }
                    showToast('✅ Mensaje eliminado');
                }
            } catch (error) {
                console.error('Error eliminando mensaje:', error);
                showToast('❌ Error al eliminar', true);
            }
        };

        // ============================================================
        // TYPING
        // ============================================================
        function handleTyping() {
            if (!socket || !socket.connected || !currentConversation) return;
            if (typingTimeout) clearTimeout(typingTimeout);
            if (!isTyping && messageInput && messageInput.value.trim().length > 0) {
                isTyping = true;
                socket.emit('typing', { to: currentConversation.id, isTyping: true });
            }
            typingTimeout = setTimeout(() => {
                if (isTyping) {
                    isTyping = false;
                    socket.emit('typing', { to: currentConversation.id, isTyping: false });
                }
            }, 1000);
        }

        // ============================================================
        // SOCKET
        // ============================================================
        function initSocket() {
            const token = getToken();
            if (!token) return;

            if (socket) {
                socket.disconnect();
                socket = null;
            }

            socket = io(API_URL, {
                auth: { token },
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });
            window.socket = socket;

            socket.on('connect', () => {
                console.log('🔌 Socket conectado en chat');
                if (currentUser) {
                    socket.emit('user_online', { page: 'chat' });
                }
            });

            socket.on('receive_message', (message) => {
                if (currentConversation && message.from === currentConversation.id) {
                    const newMsg = { ...message, isOwn: false };
                    messages.push(newMsg);
                    appendSingleMessage(newMsg);
                    markMessagesAsRead(currentConversation.id);
                    saveChatState(currentConversation.id);
                }
                loadConversations();
                if (message.from !== currentConversation?.id) {
                    showToast(`📩 Nuevo mensaje de ${message.fromName || 'alguien'}`);
                }
            });

            socket.on('chat_request_received', (data) => {
                showToast(`📨 ${data.fromUser?.fullName || 'Alguien'} quiere chatear contigo`);
                loadConversations();
            });

            socket.on('chat_request_accepted', (data) => {
                showToast(`✅ ${data.fromUser?.fullName || 'Alguien'} aceptó tu solicitud de chat`);
                loadConversations();
                if (currentConversation && currentConversation.id === data.fromUserId) {
                    loadMessages(currentConversation.id, false, 0);
                }
            });

            socket.on('message_sent', (message) => {
                const index = messages.findIndex(m => m.id === message.id);
                if (index !== -1) {
                    messages[index] = message;
                    updateSingleMessage(message.id, message);
                    saveChatState(currentConversation?.id);
                }
            });

            socket.on('user_typing', (data) => {
                const indicator = document.getElementById('typingIndicator');
                if (indicator && currentConversation && data.from === currentConversation.id) {
                    indicator.style.display = data.isTyping ? 'block' : 'none';
                    if (data.isTyping) {
                        setTimeout(() => {
                            if (indicator && indicator.style.display === 'block') {
                                indicator.style.display = 'none';
                            }
                        }, 3000);
                    }
                }
            });

            socket.on('messages_read', (data) => {
                if (currentConversation && data.byUserId === currentConversation.id) {
                    let updated = false;
                    messages.forEach(msg => {
                        if (msg.isOwn && !msg.read) {
                            msg.read = true;
                            updated = true;
                        }
                    });
                    if (updated) {
                        renderMessages();
                        saveChatState(currentConversation.id);
                    }
                }
                loadConversations();
            });

            socket.on('message_deleted', (data) => {
                messages = messages.filter(m => m.id !== data.messageId);
                removeSingleMessage(data.messageId);
                saveChatState(currentConversation?.id);
            });

            socket.on('conversations_update', () => {
                loadConversations();
            });

            socket.on('user_status_changed', (data) => {
                userStatuses.set(data.userId, { status: data.status, lastSeen: data.lastSeen });
                if (currentConversation && currentConversation.id === data.userId) {
                    updateChatHeaderStatus(data.userId);
                }
                renderConversations();
            });

            socket.on('disconnect', () => {
                console.log('🔌 Socket desconectado');
            });
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        async function init() {
            currentUser = getCurrentUser();
            if (!currentUser) {
                const token = getToken();
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }
                try {
                    const res = await fetch(`${API_URL}/api/users/profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) currentUser = await res.json();
                } catch (error) { console.error('Error cargando usuario:', error); }
            }

            const searchInput = document.getElementById('searchConversations');
            if (searchInput) {
                searchInput.addEventListener('input', () => renderConversations());
            }

            await loadConversations();
            initSocket();

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            if (userId) {
                setTimeout(async () => {
                    await window.selectConversation(userId);
                }, 500);
            }

            console.log('📱 Chat mobile optimizado con persistencia y solicitudes');
        }

        // Exponer funciones globales
        window.selectConversation = window.selectConversation;
        window.sendMessage = window.sendMessage;
        window.deleteMessage = window.deleteMessage;
        window.switchChatTab = window.switchChatTab;
        window.acceptChatRequest = window.acceptChatRequest;
        window.rejectChatRequest = window.rejectChatRequest;

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
