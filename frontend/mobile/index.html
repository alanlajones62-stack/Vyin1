<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>Vyin · Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Estilos de modales -->
    <link rel="stylesheet" href="/mobile/story-modal.css" />
    <link rel="stylesheet" href="/mobile/profile-modal.css" />
    <link rel="stylesheet" href="/mobile/story-creator-modal.css" />
    <link rel="stylesheet" href="/mobile/explore-modal.css" />
    <link rel="stylesheet" href="/mobile/activity-modal.css" />
    <link rel="stylesheet" href="/mobile/edit-profile-modal.css" />
    <link rel="stylesheet" href="/mobile/followers-modal.css" />
    
    <style>
        /* ============================================================
           ESTILOS PRINCIPALES
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 0; }

        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            background: #0a0a1a;
            position: relative;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 6px;
            height: 52px;
            min-height: 52px;
            max-height: 52px;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.3), rgba(219, 39, 119, 0.3), transparent);
            opacity: 0.5;
        }

        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .app-header .logo img {
            height: 32px;
            width: auto;
            display: block;
        }

        .app-header .logo .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #db2777, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .app-header .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-header .user-badge {
            display: none;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 2px 10px 2px 2px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }
        .app-header .user-badge:active {
            transform: scale(0.95);
        }
        .app-header .user-badge .avatar-wrapper {
            position: relative;
            width: 28px;
            height: 28px;
        }
        .app-header .user-badge .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(192, 132, 252, 0.3);
        }
        .app-header .user-badge .user-name {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-header .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
        }
        .app-header .icon-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.08);
        }
        .app-header .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: linear-gradient(135deg, #ff4444, #ff6b6b);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 2px solid #0a0a1a;
        }

        /* ============================================================
           SECCIONES PRINCIPALES (INICIO Y PERFIL)
        ============================================================ */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .section {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
            will-change: transform, opacity;
        }

        .section.hidden {
            transform: translateX(30px);
            opacity: 0;
            pointer-events: none;
        }

        .section:not(.hidden) {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================================
           FILTROS (SOLO EN INICIO)
        ============================================================ */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px 6px;
            background: rgba(10, 10, 26, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            z-index: 5;
        }

        .filter-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .filter-btn i {
            font-size: 13px;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.2), rgba(219, 39, 119, 0.12));
            color: #c084fc;
            box-shadow: 0 2px 12px rgba(192, 132, 252, 0.08);
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        /* ============================================================
           FEED CONTAINER (SECCIÓN INICIO)
        ============================================================ */
        .feed-container {
            height: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        /* ============================================================
           PERFIL CONTAINER (SECCIÓN PERFIL)
        ============================================================ */
        .profile-container {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            position: relative;
            background: #0a0a1a;
        }
        .profile-container::-webkit-scrollbar { display: none; }

        /* ============================================================
           PERFIL NATIVO - ESTILOS
        ============================================================ */
        .profile-native {
            padding: 0 0 80px 0;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .profile-native .profile-cover-native {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 16px;
            background: linear-gradient(180deg, rgba(20, 20, 40, 0.6) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .profile-native .profile-avatar-native {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(192, 132, 252, 0.3);
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .profile-native .profile-name-native {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-native .profile-name-native .verified-badge {
            color: #c084fc;
            font-size: 16px;
        }

        .profile-native .profile-username-native {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }

        .profile-native .profile-bio-native {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 8px;
            max-width: 300px;
            line-height: 1.4;
        }

        .profile-native .profile-country-native {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 4px;
        }

        .profile-native .profile-follow-btn-native {
            margin: 16px 0 12px;
            padding: 10px 32px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            background: linear-gradient(135deg, #c084fc, #db2777);
            color: #fff;
            box-shadow: 0 4px 20px rgba(192, 132, 252, 0.3);
        }
        .profile-native .profile-follow-btn-native:active {
            transform: scale(0.95);
        }
        .profile-native .profile-follow-btn-native.following {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            box-shadow: none;
        }

        .profile-native .profile-stats-native {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin: 0 20px;
        }

        .profile-native .profile-stats-native .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .profile-native .profile-stats-native .stat:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.03);
        }
        .profile-native .profile-stats-native .stat .number {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .profile-native .profile-stats-native .stat .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .profile-native .profile-stories-native {
            padding: 16px 20px;
        }

        .profile-native .profile-stories-native .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
        }

        .profile-native .profile-stories-native .section-title i {
            color: #c084fc;
        }

        .profile-native .profile-stories-grid-native {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .profile-native .profile-story-thumb-native {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .profile-native .profile-story-thumb-native:active {
            transform: scale(0.95);
        }
        .profile-native .profile-story-thumb-native img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-native .profile-story-thumb-native .thumb-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 6px;
            background: linear-gradient(0deg, rgba(0,0,0,0.5), transparent);
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .profile-native .profile-story-thumb-native .thumb-overlay i {
            font-size: 8px;
        }

        .profile-native .profile-story-thumb-native .text-thumb {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            padding: 8px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            word-break: break-word;
        }

        .profile-native .profile-no-stories-native {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: rgba(255, 255, 255, 0.1);
            gap: 4px;
        }
        .profile-native .profile-no-stories-native i {
            font-size: 28px;
        }
        .profile-native .profile-no-stories-native span {
            font-size: 12px;
        }

        /* ============================================================
           STORY CARD
        ============================================================ */
        .story-card {
            height: calc(100dvh - 52px - 44px - 74px);
            min-height: calc(100dvh - 52px - 44px - 74px);
            max-height: calc(100dvh - 52px - 44px - 74px);
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0a0a1a;
            overflow: hidden;
            border: none;
            margin: 0;
            border-radius: 0;
            flex-shrink: 0;
        }

        .story-card .card-header {
            display: flex;
            align-items: center;
            padding: 10px 14px 8px;
            gap: 10px;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
        }

        .story-card .card-header .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            cursor: pointer;
        }

        .story-card .card-header .info {
            flex: 1;
            min-width: 0;
        }
        .story-card .card-header .info .name {
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .story-card .card-header .info .handle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .story-card .card-header .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }

        .story-card .card-media {
            flex: 1;
            width: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            min-height: 0;
            cursor: pointer;
        }
        .story-card .card-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .story-card .card-media video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .story-card .card-media .text-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            line-height: 1.5;
            padding: 30px;
        }

        .story-card .card-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 14px 14px;
            padding-bottom: 58px;
            background: linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0) 100%);
            z-index: 5;
            pointer-events: none;
        }

        .story-card .card-footer * {
            pointer-events: auto;
        }

        .story-card .card-footer .caption {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
            line-height: 1.4;
            text-shadow: 0 1px 12px rgba(0,0,0,0.5);
            font-weight: 400;
        }
        .story-card .card-footer .caption .hashtag {
            color: #c084fc;
            font-weight: 500;
        }

        .story-card .card-footer .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .story-card .card-footer .actions .stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
        .story-card .card-footer .actions .stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .story-card .card-footer .actions .stats i {
            font-size: 13px;
        }

        .story-card .card-footer .actions .btns {
            display: flex;
            gap: 4px;
        }
        .story-card .card-footer .actions .btns button {
            padding: 4px 12px;
            border: none;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .story-card .card-footer .actions .btns button:active {
            transform: scale(0.92);
        }

        .btn-like {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }
        .btn-like.liked {
            background: linear-gradient(135deg, #ff6b6b, #ff4444);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.25);
        }
        .btn-comment {
            background: rgba(192, 132, 252, 0.12);
            color: #c084fc;
        }
        .btn-share {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            padding: 4px 10px !important;
        }

        /* ============================================================
           EMPTY STATE
        ============================================================ */
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            color: rgba(255, 255, 255, 0.15);
        }
        .empty-state i {
            font-size: 56px;
            color: rgba(192, 132, 252, 0.05);
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.12);
        }

        /* ============================================================
           BOTTOM NAV
        ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 460px;
            height: 66px;
            background: rgba(18, 18, 38, 0.85);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .bottom-nav::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(1px);
        }

        .bottom-nav .create-btn {
            background: linear-gradient(135deg, #c084fc, #db2777, #f43f5e);
            color: #fff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 4px 20px rgba(192, 132, 252, 0.35),
                0 0 0 4px rgba(18, 18, 38, 0.6),
                0 0 0 6px rgba(255, 255, 255, 0.05),
                inset 0 2px 0 rgba(255, 255, 255, 0.2);
            margin-top: -20px;
            padding: 0;
            min-width: auto;
            border: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
        }

        .bottom-nav .create-btn::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 15%;
            right: 15%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.6;
        }

        .bottom-nav .create-btn .nav-icon {
            font-size: 22px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .bottom-nav .create-btn:active {
            transform: scale(0.88) rotate(90deg);
        }

        .bottom-nav .create-btn .label {
            display: none;
        }

        .bottom-nav .create-btn::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid rgba(192, 132, 252, 0.1);
            animation: breathe 2.5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.08); opacity: 0.6; }
        }

        .bottom-nav button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.25);
            font-size: 18px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            font-family: inherit;
            position: relative;
            min-width: 44px;
            height: 50px;
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }

        .bottom-nav button .nav-icon {
            font-size: 18px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            line-height: 1;
        }

        .bottom-nav button .label {
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.2px;
            opacity: 0.3;
            transition: all 0.3s ease;
            font-variant: small-caps;
        }

        .bottom-nav button.active {
            color: #c084fc;
        }
        
        .bottom-nav button.active .label {
            opacity: 1;
            color: #c084fc;
        }

        .bottom-nav button.active .nav-icon {
            transform: translateY(-2px) scale(1.05);
        }

        .bottom-nav button.active::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(192, 132, 252, 0.08);
            z-index: -1;
            animation: iosPulse 0.4s ease;
        }

        @keyframes iosPulse {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .bottom-nav button:active {
            transform: scale(0.88);
        }

        .bottom-nav button .nav-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: linear-gradient(135deg, #ff4444, #ff6b6b);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 2px solid rgba(18, 18, 38, 0.85);
        }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast {
            position: fixed;
            bottom: 88px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: toastFade 2.8s ease;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            pointer-events: none;
        }
        .toast.error { border-left: 3px solid #ff4444; }
        .toast.success { border-left: 3px solid #22c55e; }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.95); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(0.95); }
        }

        /* ============================================================
           NEW STORIES BADGE
        ============================================================ */
        #newBadge {
            position: fixed;
            top: 106px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #c084fc, #db2777);
            color: #fff;
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 20px rgba(192, 132, 252, 0.3);
            display: none;
            align-items: center;
            gap: 8px;
            border: none;
            animation: slideDown 0.35s ease;
        }
        #newBadge:active { transform: translateX(-50%) scale(0.95); }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 480px) {
            .filter-btn {
                font-size: 11px;
                padding: 5px 12px;
            }
            .app-header .logo img {
                height: 28px;
            }
            .app-header .logo .logo-text {
                font-size: 17px;
            }
            .bottom-nav {
                width: calc(100% - 16px);
                height: 58px;
                border-radius: 18px;
                bottom: 6px;
            }
            .bottom-nav button {
                min-width: 38px;
                height: 42px;
                padding: 4px 6px;
            }
            .bottom-nav button .nav-icon {
                font-size: 16px;
            }
            .bottom-nav .create-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
                margin-top: -18px;
            }
            .bottom-nav .create-btn .nav-icon {
                font-size: 18px;
            }
            .bottom-nav button.active::before {
                width: 36px;
                height: 36px;
            }
            .story-card {
                height: calc(100dvh - 52px - 44px - 74px);
                min-height: calc(100dvh - 52px - 44px - 74px);
                max-height: calc(100dvh - 52px - 44px - 74px);
            }
            .bottom-nav .create-btn::after {
                display: none;
            }
            .profile-native .profile-avatar-native {
                width: 64px;
                height: 64px;
            }
            .profile-native .profile-name-native {
                font-size: 17px;
            }
            .profile-native .profile-stats-native {
                gap: 20px;
            }
            .profile-native .profile-stats-native .stat .number {
                font-size: 16px;
            }
            .profile-native .profile-stories-grid-native {
                gap: 4px;
            }
        }

        @media (max-width: 380px) {
            .bottom-nav {
                height: 52px;
                border-radius: 14px;
                bottom: 4px;
                padding: 0 2px;
            }
            .bottom-nav button {
                min-width: 32px;
                height: 36px;
            }
            .bottom-nav button .nav-icon {
                font-size: 14px;
            }
            .bottom-nav button .label {
                font-size: 7px;
            }
            .bottom-nav .create-btn {
                width: 38px;
                height: 38px;
                font-size: 15px;
                margin-top: -15px;
            }
            .bottom-nav .create-btn .nav-icon {
                font-size: 15px;
            }
            .bottom-nav button.active::before {
                width: 30px;
                height: 30px;
            }
            .story-card {
                height: calc(100dvh - 52px - 40px - 64px);
                min-height: calc(100dvh - 52px - 40px - 64px);
                max-height: calc(100dvh - 52px - 40px - 64px);
            }
            .profile-native .profile-avatar-native {
                width: 56px;
                height: 56px;
            }
            .profile-native .profile-name-native {
                font-size: 15px;
            }
            .profile-native .profile-stats-native {
                gap: 14px;
            }
            .profile-native .profile-stats-native .stat .number {
                font-size: 14px;
            }
        }

        @media (min-width: 768px) {
            #app {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid rgba(255, 255, 255, 0.03);
                border-right: 1px solid rgba(255, 255, 255, 0.03);
            }
            .bottom-nav {
                max-width: 420px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .app-header {
                height: 40px;
                min-height: 40px;
                max-height: 40px;
                padding: 4px 10px;
            }
            .app-header .logo img {
                height: 24px;
            }
            .filter-bar {
                padding: 4px 10px;
            }
            .bottom-nav {
                height: 48px;
                border-radius: 14px;
                bottom: 4px;
                padding: 0 4px;
                width: calc(100% - 16px);
            }
            .bottom-nav button {
                height: 36px;
                min-width: 32px;
            }
            .bottom-nav button .nav-icon {
                font-size: 14px;
            }
            .bottom-nav button .label {
                font-size: 7px;
            }
            .bottom-nav .create-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
                margin-top: -14px;
            }
            .bottom-nav .create-btn .nav-icon {
                font-size: 14px;
            }
            .bottom-nav button.active::before {
                width: 30px;
                height: 30px;
            }
            .story-card {
                height: calc(100dvh - 40px - 38px - 60px);
                min-height: calc(100dvh - 40px - 38px - 60px);
                max-height: calc(100dvh - 40px - 38px - 60px);
            }
            .bottom-nav .create-btn::after {
                display: none;
            }
            .profile-native .profile-avatar-native {
                width: 48px;
                height: 48px;
            }
            .profile-native .profile-name-native {
                font-size: 15px;
            }
            .profile-native .profile-stats-native {
                gap: 16px;
                padding: 8px 0;
            }
            .profile-native .profile-stats-native .stat .number {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- HEADER -->
        <header class="app-header">
            <div class="logo" id="logoBtn">
                <img src="/images/logo.png" alt="Vyin" />
                <span class="logo-text">Vyin</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settingsBtn" title="Configuración">
                    <i class="fas fa-cog"></i>
                </button>
                <div class="user-badge" id="userBadge" style="display:none;">
                    <div class="avatar-wrapper">
                        <img id="headerAvatar" src="" alt="" />
                    </div>
                    <span class="user-name" id="headerName">Usuario</span>
                </div>
                <button class="icon-btn" id="loginBtn" onclick="window.location.href='/login.html'">
                    <i class="fas fa-sign-in-alt"></i>
                </button>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-content">

            <!-- ==========================================================
                 SECCIÓN 1: INICIO (FEED)
            ========================================================== -->
            <section class="section" id="sectionFeed">
                <!-- FILTROS -->
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="ranked" id="filterRanked">
                        <i class="fas fa-rocket"></i> Para ti
                    </button>
                    <button class="filter-btn" data-filter="recent" id="filterRecent">
                        <i class="fas fa-clock"></i> Recientes
                    </button>
                    <button class="filter-btn" data-filter="trending" id="filterTrending">
                        <i class="fas fa-fire"></i> Tendencias
                    </button>
                </div>

                <!-- FEED -->
                <div class="feed-container" id="feedContainer">
                    <div class="empty-state" id="loadingState">
                        <i class="fas fa-spinner fa-pulse"></i>
                        <h3>Cargando historias</h3>
                        <p>Descubre lo que está pasando</p>
                    </div>
                </div>
            </section>

            <!-- ==========================================================
                 SECCIÓN 2: PERFIL (NATIVO)
            ========================================================== -->
            <section class="section hidden" id="sectionProfile">
                <div class="profile-container" id="profileContainer">
                    <div class="profile-native" id="profileNativeContent">
                        <!-- Estado de carga -->
                        <div class="empty-state" id="profileLoadingState">
                            <i class="fas fa-spinner fa-pulse"></i>
                            <h3>Cargando perfil</h3>
                            <p>Espera un momento...</p>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <!-- NEW STORIES BADGE -->
        <button id="newBadge" onclick="window.loadPendingStories()">
            <i class="fas fa-plus-circle"></i>
            <span id="newBadgeText">Nuevas historias</span>
            <span class="badge-count" id="newBadgeCount">0</span>
        </button>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button class="active" id="navFeed">
                <span class="nav-icon"><i class="fas fa-home"></i></span>
                <span class="label">Inicio</span>
            </button>
            <button id="navExplore">
                <span class="nav-icon"><i class="fas fa-compass"></i></span>
                <span class="label">Explorar</span>
            </button>
            <button class="create-btn" id="createBtn">
                <span class="nav-icon"><i class="fas fa-plus"></i></span>
            </button>
            <button id="navNotifications">
                <span class="nav-icon"><i class="fas fa-heart"></i></span>
                <span class="label">Actividad</span>
                <span class="nav-badge" id="navNotifBadge" style="display:none;">0</span>
            </button>
            <button id="navProfile">
                <span class="nav-icon"><i class="fas fa-user"></i></span>
                <span class="label">Perfil</span>
            </button>
        </nav>
    </div>

    <!-- SOCKET.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <!-- IMPORTS -->
    <script type="importmap">
        {
            "imports": {
                "./": "./",
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <!-- SCRIPTS -->
    <script type="module" src="/mobile/app.js"></script>
    <script type="module" src="/mobile/auth.js"></script>
    <script type="module" src="/mobile/utils.js"></script>
    <script type="module" src="/mobile/story-modal.js"></script>
    <script type="module" src="/mobile/profile-modal.js"></script>
    <script type="module" src="/mobile/explore-modal.js"></script>
    <script type="module" src="/mobile/activity-modal.js"></script>
    <script type="module" src="/mobile/story-creator-modal.js"></script>
    <script type="module" src="/mobile/edit-profile-modal.js"></script>
    <script type="module" src="/mobile/followers-modal.js"></script>

</body>
</html>
