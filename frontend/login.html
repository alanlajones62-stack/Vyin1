<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyn Social - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #05050f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(20, 20, 35, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 540px;
            padding: 35px;
            border: 1px solid rgba(192, 132, 252, 0.15);
            max-height: 98vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar { width: 4px; }
        .container::-webkit-scrollbar-track { background: transparent; }
        .container::-webkit-scrollbar-thumb { background: rgba(192,132,252,0.3); border-radius: 10px; }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #db2777, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .logo i {
            background: linear-gradient(135deg, #c084fc, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            margin-bottom: 18px;
        }

        .location-info {
            background: rgba(192, 132, 252, 0.08);
            border: 1px solid rgba(192, 132, 252, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .location-info .icon {
            font-size: 18px;
            color: #c084fc;
        }

        .location-info .info-text {
            flex: 1;
            color: rgba(255,255,255,0.6);
        }

        .location-info .info-text strong {
            color: #c084fc;
        }

        .location-info .status {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
        }

        .location-info .status .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid #c084fc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 18px;
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            font-size: 13px;
        }

        label .required {
            color: #ff6b6b;
            margin-left: 2px;
        }

        label .auto-detected {
            color: #22c55e;
            font-size: 10px;
            font-weight: 400;
            margin-left: 6px;
        }

        label .readonly-badge {
            color: #fbbf24;
            font-size: 10px;
            font-weight: 400;
            margin-left: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #c084fc;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(192,132,252,0.15);
        }

        input:disabled, select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(255,255,255,0.03);
        }

        input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #c084fc, #db2777);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(192,132,252,0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 16px;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }

        .toggle-mode a {
            color: #c084fc;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toggle-mode a:hover {
            color: #db2777;
            text-decoration: underline;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: none;
            font-size: 13px;
            font-weight: 500;
        }

        .message.error {
            background: rgba(255,68,68,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,68,68,0.2);
            display: block;
        }

        .message.success {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.2);
            display: block;
        }

        .message.info {
            background: rgba(192,132,252,0.15);
            color: #c084fc;
            border: 1px solid rgba(192,132,252,0.2);
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .password-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 3px;
        }

        .dob-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 3px;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .detected-badge {
            display: inline-block;
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 20px;
            margin-left: 6px;
        }

        @media (max-width: 520px) {
            .container { padding: 16px; }
            .form-row { grid-template-columns: 1fr; }
            .form-row-3 { grid-template-columns: 1fr; }
            .logo { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><i class="fas fa-bolt"></i> Vyn Social</div>
        <div class="subtitle">Conecta con el mundo</div>
        
        <!-- Ubicación detectada automáticamente -->
        <div class="location-info" id="locationInfo">
            <div class="icon"><i class="fas fa-globe-americas"></i></div>
            <div class="info-text">
                <span id="locationText">Detectando ubicación...</span>
            </div>
            <div class="status" id="locationStatus">
                <span class="spinner"></span> Buscando...
            </div>
        </div>
        
        <h2 id="formTitle">Iniciar Sesión</h2>
        
        <div id="message" class="message"></div>
        
        <form id="authForm" novalidate>
            <!-- Campos de registro -->
            <div id="registerFields" class="hidden">
                <div class="form-group">
                    <label>Nombre de usuario <span class="required">*</span></label>
                    <input type="text" id="username" placeholder="ej: juan_perez" autocomplete="username" maxlength="30">
                </div>
                
                <div class="form-group">
                    <label>Nombre completo <span class="required">*</span></label>
                    <input type="text" id="fullName" placeholder="Juan Pérez" autocomplete="name" maxlength="50">
                </div>
                
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Fecha de nacimiento <span class="required">*</span></label>
                        <input type="date" id="birthDate" max="2013-01-01" min="1900-01-01">
                        <div class="dob-hint">Debes tener al menos 13 años</div>
                    </div>
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="text" id="ageDisplay" disabled placeholder="-- años">
                    </div>
                    <div class="form-group">
                        <label>Idioma <span class="required">*</span></label>
                        <select id="language">
                            <!-- Cargado por JavaScript -->
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>País <span class="auto-detected">(detectado)</span></label>
                        <input type="text" id="countryDisplay" disabled placeholder="Detectando país...">
                        <input type="hidden" id="countryCode">
                    </div>
                    <div class="form-group">
                        <label>Región / Continente <span class="readonly-badge">(no modificable)</span></label>
                        <input type="text" id="regionDisplay" disabled placeholder="Detectando región...">
                        <input type="hidden" id="region">
                    </div>
                </div>
            </div>
            
            <!-- Campos comunes -->
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label>Contraseña <span class="required">*</span></label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6">
                <div class="password-hint">Mínimo 6 caracteres</div>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Iniciar Sesión</span>
            </button>
        </form>
        
        <div class="toggle-mode">
            <a id="toggleLink">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>

        // ============================================================
        // DETECCIÓN DE DISPOSITIVO MÓVIL (SOLO TELÉFONOS)
        // ============================================================

        function isMobileDevice() {
            const isSmallScreen = window.innerWidth < 768;
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            
            const mobilePatterns = [
                /Android/i, /iPhone/i, /iPod/i, /BlackBerry/i,
                /Windows Phone/i, /Opera Mini/i, /IEMobile/i
            ];
            
            const tabletPatterns = [
                /iPad/i, /Tablet/i, /Kindle/i, /Silk/i, /PlayBook/i, /KF[A-Z]/i
            ];
            
            const isTablet = tabletPatterns.some(pattern => pattern.test(ua));
            const isMobile = mobilePatterns.some(pattern => pattern.test(ua));
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            return isMobile && !isTablet && (isSmallScreen || hasTouch);
        }

        function redirectToMobileIfNeeded() {
            if (isMobileDevice()) {
                console.log('📱 Dispositivo móvil detectado - redirigiendo a mobile/');
                if (!sessionStorage.getItem('mobile_redirected')) {
                    sessionStorage.setItem('mobile_redirected', 'true');
                    window.location.href = '/mobile/index.html';
                }
            } else {
                sessionStorage.removeItem('mobile_redirected');
            }
        }

        // Ejecutar inmediatamente
        redirectToMobileIfNeeded();

        // También al cambiar el tamaño de la ventana

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (isMobileDevice() && !window.location.pathname.includes('/mobile/')) {

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const API_URL = window.location.origin;
        let isLogin = true;
        let isLoading = false;
        let locationDetected = false;
        let userCountry = null;
        let userCountryCode = null;
        let detectedRegion = null;

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const form = document.getElementById('authForm');
        const title = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const toggleLink = document.getElementById('toggleLink');
        const messageEl = document.getElementById('message');
        const registerFields = document.getElementById('registerFields');
        const locationText = document.getElementById('locationText');
        const locationStatus = document.getElementById('locationStatus');

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const fullNameInput = document.getElementById('fullName');
        const birthDateInput = document.getElementById('birthDate');
        const ageDisplayInput = document.getElementById('ageDisplay');
        const languageSelect = document.getElementById('language');
        const countryDisplay = document.getElementById('countryDisplay');
        const countryCodeInput = document.getElementById('countryCode');
        const regionDisplay = document.getElementById('regionDisplay');
        const regionInput = document.getElementById('region');

        // ============================================================
        // CARGAR IDIOMAS
        // ============================================================
        function loadLanguages() {
            languageSelect.innerHTML = '';
            LANGUAGES.sort((a, b) => a.name.localeCompare(b.name));
            LANGUAGES.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang.code;
                option.textContent = lang.name;
                languageSelect.appendChild(option);
            });
            const browserLang = navigator.language.split('-')[0];
            const langMatch = LANGUAGES.find(l => l.code === browserLang);
            if (langMatch) languageSelect.value = langMatch.code;
        }

        // ============================================================
        // CALCULAR EDAD
        // ============================================================
        function calculateAge(birthDate) {
            if (!birthDate) return null;
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        birthDateInput.addEventListener('change', function() {
            const age = calculateAge(this.value);
            if (age !== null) {
                ageDisplayInput.value = age + ' años';
                if (age < 13) {
                    ageDisplayInput.style.color = '#ff6b6b';
                    showMessage('Debes tener al menos 13 años para registrarte', 'error');
                } else {
                    ageDisplayInput.style.color = '#22c55e';
                    hideMessage();
                }
            } else {
                ageDisplayInput.value = '-- años';
                ageDisplayInput.style.color = '';
            }
        });

        // ============================================================
        // DETECCIÓN DE UBICACIÓN
        // ============================================================
        function detectLocation() {
            locationText.textContent = 'Detectando ubicación...';
            locationStatus.innerHTML = '<span class="spinner"></span> Buscando...';

            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    if (data && data.country_code && data.country_name) {
                        userCountryCode = data.country_code.toUpperCase();
                        userCountry = data.country_name;
                        detectedRegion = COUNTRY_REGION_MAP[userCountryCode] || 'other';
                        updateLocationUI(true);
                        return;
                    }
                    throw new Error('No se pudo obtener ubicación por IP');
                })
                .catch(() => {
                    fetch('http://ip-api.com/json/')
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.status === 'success') {
                                userCountryCode = data.countryCode;
                                userCountry = data.country;
                                detectedRegion = COUNTRY_REGION_MAP[userCountryCode] || 'other';
                                updateLocationUI(true);
                            } else {
                                updateLocationUI(false);
                            }
                        })
                        .catch(() => {
                            try {
                                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                                let region = 'other';
                                if (timezone.includes('America')) {
                                    if (timezone.includes('North') || timezone.includes('US') || timezone.includes('Canada') || timezone.includes('Mexico')) {
                                        region = 'north_america';
                                    } else if (timezone.includes('Central') || timezone.includes('Caribbean')) {
                                        region = 'central_america';
                                    } else {
                                        region = 'south_america';
                                    }
                                } else if (timezone.includes('Europe')) {
                                    region = 'europe';
                                } else if (timezone.includes('Asia')) {
                                    region = 'asia';
                                } else if (timezone.includes('Africa')) {
                                    region = 'africa';
                                } else if (timezone.includes('Pacific') || timezone.includes('Australia')) {
                                    region = 'oceania';
                                } else if (timezone.includes('Antarctica')) {
                                    region = 'antarctica';
                                }
                                detectedRegion = region;
                                userCountry = 'Desconocido';
                                userCountryCode = 'OT';
                                updateLocationUI(false);
                            } catch (e) {
                                updateLocationUI(false);
                            }
                        });
                });
        }

        function updateLocationUI(success) {
            locationDetected = true;
            if (success && userCountry) {
                const countryName = COUNTRIES[userCountryCode] || userCountry;
                countryDisplay.value = countryName;
                countryCodeInput.value = userCountryCode;
                const regionName = REGIONS[detectedRegion] || '🌐 Otra región';
                regionDisplay.value = regionName;
                regionInput.value = detectedRegion || 'other';
                locationText.textContent = `📍 ${countryName} • ${regionName}`;
                locationStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#22c55e;"></i> Detectado';
                locationStatus.style.color = '#22c55e';
            } else {
                countryDisplay.value = 'No detectado (selecciona manualmente)';
                regionDisplay.value = 'No detectado (selecciona manualmente)';
                locationText.textContent = '🌍 Ubicación no detectada';
                locationStatus.innerHTML = '<i class="fas fa-exclamation-circle" style="color:#fbbf24;"></i> Manual';
                locationStatus.style.color = '#fbbf24';
            }
        }

        // ============================================================
        // FUNCIONES
        // ============================================================
        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function hideMessage() {
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        function setLoading(loading) {
            isLoading = loading;
            submitBtn.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="loading-spinner"></span> Cargando...';
            } else {
                btnText.textContent = isLogin ? 'Iniciar Sesión' : 'Registrarse';
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function validateAge(birthDate) {
            const age = calculateAge(birthDate);
            return age !== null && age >= 13;
        }

        // ============================================================
        // TOGGLE MODE
        // ============================================================
        toggleLink.addEventListener('click', () => {
            isLogin = !isLogin;
            hideMessage();
            if (isLogin) {
                registerFields.classList.add('hidden');
                title.textContent = 'Iniciar Sesión';
                btnText.textContent = 'Iniciar Sesión';
                toggleLink.textContent = '¿No tienes cuenta? Regístrate';
            } else {
                registerFields.classList.remove('hidden');
                title.textContent = 'Crear Cuenta';
                btnText.textContent = 'Registrarse';
                toggleLink.textContent = '¿Ya tienes cuenta? Inicia Sesión';
                if (locationDetected) {
                    updateLocationUI(true);
                } else {
                    detectLocation();
                }
            }
        });

        // ============================================================
        // SUBMIT
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();
            if (isLoading) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('Por favor, completa todos los campos obligatorios', 'error');
                return;
            }
            if (!validateEmail(email)) {
                showMessage('Por favor, ingresa un email válido', 'error');
                return;
            }
            if (!validatePassword(password)) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            let url = `${API_URL}/api/auth/login`;
            let body = { email, password };

            if (!isLogin) {
                const username = usernameInput.value.trim();
                const fullName = fullNameInput.value.trim();
                const birthDate = birthDateInput.value;
                const language = languageSelect.value;
                const region = regionInput.value || 'other';

                if (!username || !fullName || !birthDate) {
                    showMessage('Por favor, completa todos los campos de registro', 'error');
                    return;
                }
                if (username.length < 3) {
                    showMessage('El nombre de usuario debe tener al menos 3 caracteres', 'error');
                    return;
                }
                if (!validateAge(birthDate)) {
                    showMessage('Debes tener al menos 13 años para registrarte', 'error');
                    return;
                }

                let country = countryCodeInput.value || 'OT';
                let countryName = countryDisplay.value || 'Otro';
                if (country && country !== 'OT' && COUNTRIES[country]) {
                    countryName = COUNTRIES[country];
                }
                if (!countryCodeInput.value && countryDisplay.value && countryDisplay.value !== 'No detectado (selecciona manualmente)') {
                    const found = Object.entries(COUNTRIES).find(([code, name]) => 
                        name.toLowerCase() === countryDisplay.value.toLowerCase()
                    );
                    if (found) {
                        country = found[0];
                        countryName = found[1];
                    }
                }

                const age = calculateAge(birthDate);
                url = `${API_URL}/api/auth/register`;
                body = {
                    username,
                    email,
                    password,
                    fullName,
                    birthDate,
                    age,
                    language,
                    region,
                    country,
                    countryName
                };
            }

            setLoading(true);

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('¡Éxito! Redirigiendo...', 'success');
                    setTimeout(() => {
                        // Redirigir según dispositivo
                        if (isMobileDevice()) {
                            window.location.href = '/mobile/index.html';
                        } else {
                            window.location.href = 'feed.html';
                        }
                    }, 1200);
                } else {
                    showMessage(data.error || 'Error al procesar la solicitud', 'error');
                    setLoading(false);
                }
            } catch (err) {
                console.error('Error:', err);
                showMessage('Error de conexión. Verifica tu internet.', 'error');
                setLoading(false);
            }
        });

        // ============================================================
        // VALIDACIÓN EN TIEMPO REAL
        // ============================================================
        emailInput.addEventListener('input', () => {
            if (emailInput.value.trim() && !validateEmail(emailInput.value)) {
                emailInput.style.borderColor = '#ff6b6b';
            } else {
                emailInput.style.borderColor = '';
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value && !validatePassword(passwordInput.value)) {
                passwordInput.style.borderColor = '#ff6b6b';
            } else {
                passwordInput.style.borderColor = '';
            }
        });

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        loadLanguages();
        detectLocation();

        (function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                fetch(`${API_URL}/api/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.ok) {
                        if (isMobileDevice()) {
                            window.location.href = '/mobile/';
                        } else {
                            window.location.href = 'feed.html';
                        }
                    }
                })
                .catch(() => {});
            }
        })();

        console.log('🔐 Vyn Social Login cargado');
        console.log('📱 Detección de móvil activa');
        console.log('🌍 Regiones disponibles:', Object.keys(REGIONS).length);
        console.log('🌎 Países disponibles:', Object.keys(COUNTRIES).length);
        console.log('🗣️ Idiomas disponibles:', LANGUAGES.length);
    </script>
