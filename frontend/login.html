<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vyn Social - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           ESTILOS PRINCIPALES
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #05050f);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-y: auto;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: rgba(20, 20, 35, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            border: 1px solid rgba(192, 132, 252, 0.12);
            max-height: 98vh;
            max-height: 98dvh;
            overflow-y: auto;
            transition: all 0.3s ease;
            animation: containerIn 0.5s ease;
        }

        .container::-webkit-scrollbar { width: 3px; }
        .container::-webkit-scrollbar-track { background: transparent; }
        .container::-webkit-scrollbar-thumb { background: rgba(192,132,252,0.2); border-radius: 10px; }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           LOGO
        ============================================================ */
        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #db2777, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .logo i {
            background: linear-gradient(135deg, #c084fc, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 4px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.25);
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           TÍTULO
        ============================================================ */
        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 18px;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        /* ============================================================
           FORMULARIOS
        ============================================================ */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: rgba(255,255,255,0.6);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.2px;
        }

        label .required {
            color: #ff6b6b;
            margin-left: 2px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s ease;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus {
            outline: none;
            border-color: #c084fc;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(192,132,252,0.1);
        }

        input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .password-hint {
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            margin-top: 3px;
        }

        /* ============================================================
           BOTÓN
        ============================================================ */
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #c084fc, #db2777);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(192,132,252,0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ============================================================
           MENSAJES
        ============================================================ */
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            display: none;
            font-size: 13px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.error {
            background: rgba(255,68,68,0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255,68,68,0.15);
            display: block;
        }

        .message.success {
            background: rgba(34,197,94,0.12);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.15);
            display: block;
        }

        .message.info {
            background: rgba(192,132,252,0.12);
            color: #c084fc;
            border: 1px solid rgba(192,132,252,0.15);
            display: block;
        }

        /* ============================================================
           UTILIDADES
        ============================================================ */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           LINKS
        ============================================================ */
        .auth-links {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .auth-links .divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.08);
            font-size: 11px;
        }

        .auth-links .divider::before,
        .auth-links .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.05);
        }

        .auth-links a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 50px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .auth-links a:hover {
            color: #c084fc;
            background: rgba(192,132,252,0.06);
            border-color: rgba(192,132,252,0.1);
        }

        .auth-links a:active {
            transform: scale(0.97);
        }

        .auth-links a i {
            margin-right: 8px;
            font-size: 13px;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 520px) {
            body { padding: 12px; }
            .container { padding: 20px 16px; border-radius: 20px; max-height: 96vh; max-height: 96dvh; }
            .logo { font-size: 22px; }
            .subtitle { font-size: 12px; margin-bottom: 16px; }
            h2 { font-size: 17px; margin-bottom: 14px; }
            input { font-size: 15px; padding: 11px 12px; }
            .btn { font-size: 15px; padding: 12px; }
            .message { font-size: 12px; padding: 8px 12px; }
        }

        @media (max-width: 380px) {
            .container { padding: 14px 12px; }
            .logo { font-size: 19px; }
            input { font-size: 14px; padding: 9px 10px; }
            .btn { font-size: 14px; padding: 10px; }
            label { font-size: 11px; }
        }

        @media (min-width: 768px) {
            .container { max-width: 420px; padding: 36px 32px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            body { padding: 8px; align-items: flex-start; padding-top: 10px; }
            .container { padding: 14px 16px; max-height: 96vh; max-height: 96dvh; border-radius: 16px; }
            .logo { font-size: 18px; }
            .subtitle { font-size: 11px; margin-bottom: 10px; }
            h2 { font-size: 15px; margin-bottom: 10px; }
            .form-group { margin-bottom: 8px; }
            input { padding: 8px 10px; font-size: 13px; }
            .btn { padding: 9px; font-size: 13px; margin-top: 4px; }
            .message { padding: 6px 10px; font-size: 11px; margin-bottom: 8px; }
            .auth-links { margin-top: 10px; }
            .auth-links a { font-size: 11px; padding: 6px 12px; }
        }

        @media (min-width: 1024px) {
            .container { max-width: 460px; padding: 40px 36px; }
        }

        /* ============================================================
           DARK MODE SUPPORT
        ============================================================ */
        @media (prefers-color-scheme: light) {
            .container {
                background: rgba(30, 30, 50, 0.95);
                border-color: rgba(192, 132, 252, 0.2);
            }
        }

        /* ============================================================
           MEJORAS DE ACCESIBILIDAD
        ============================================================ */
        input:focus-visible, .btn:focus-visible, .auth-links a:focus-visible {
            outline: 2px solid #c084fc;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container" role="main" aria-label="Iniciar sesión">
        <div class="logo"><i class="fas fa-bolt"></i> Vyn Social</div>
        <div class="subtitle">Conecta con el mundo</div>
        
        <h2>Iniciar Sesión</h2>
        
        <div id="message" class="message" role="alert"></div>
        
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email" aria-label="Correo electrónico">
            </div>
            
            <div class="form-group">
                <label>Contraseña <span class="required">*</span></label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6" aria-label="Contraseña">
                <div class="password-hint">Mínimo 6 caracteres</div>
            </div>
            
            <button type="submit" class="btn" id="submitBtn" aria-label="Iniciar sesión">
                <span id="btnText">Iniciar Sesión</span>
            </button>
        </form>
        
        <div class="auth-links">
            <div class="divider">
                <span>o</span>
            </div>
            <a href="/register.html" id="registerLink">
                <i class="fas fa-user-plus"></i> Crear nueva cuenta
            </a>
        </div>
    </div>

    <script>
        // ============================================================
        // DETECCIÓN DE DISPOSITIVO MÓVIL
        // ============================================================

        function isMobileDevice() {
            const isSmallScreen = window.innerWidth < 768;
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            
            const mobilePatterns = [
                /Android/i, /iPhone/i, /iPod/i, /BlackBerry/i,
                /Windows Phone/i, /Opera Mini/i, /IEMobile/i
            ];
            
            const tabletPatterns = [
                /iPad/i, /Tablet/i, /Kindle/i, /Silk/i, /PlayBook/i, /KF[A-Z]/i
            ];
            
            const isTablet = tabletPatterns.some(pattern => pattern.test(ua));
            const isMobile = mobilePatterns.some(pattern => pattern.test(ua));
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            return isMobile && !isTablet && (isSmallScreen || hasTouch);
        }

        function redirectToMobileIfNeeded() {
            if (isMobileDevice()) {
                console.log('📱 Dispositivo móvil detectado - redirigiendo a mobile/');
                if (!sessionStorage.getItem('mobile_redirected')) {
                    sessionStorage.setItem('mobile_redirected', 'true');
                    window.location.href = '/mobile/index.html';
                }
            } else {
                sessionStorage.removeItem('mobile_redirected');
            }
        }

        redirectToMobileIfNeeded();

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (isMobileDevice() && !window.location.pathname.includes('/mobile/')) {
                    redirectToMobileIfNeeded();
                }
            }, 500);
        });

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const API_URL = window.location.origin;
        let isLoading = false;

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const messageEl = document.getElementById('message');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // ============================================================
        // FUNCIONES
        // ============================================================
        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function hideMessage() {
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        function setLoading(loading) {
            isLoading = loading;
            submitBtn.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="loading-spinner"></span> Cargando...';
            } else {
                btnText.textContent = 'Iniciar Sesión';
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        // ============================================================
        // SUBMIT
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();
            if (isLoading) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('Por favor, completa todos los campos', 'error');
                return;
            }
            if (!validateEmail(email)) {
                showMessage('Por favor, ingresa un email válido', 'error');
                return;
            }
            if (!validatePassword(password)) {
                showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('¡Bienvenido! Redirigiendo...', 'success');
                    setTimeout(() => {
                        if (isMobileDevice()) {
                            window.location.href = '/mobile/index.html';
                        } else {
                            window.location.href = '/feed.html';
                        }
                    }, 1200);
                } else {
                    showMessage(data.error || 'Error al iniciar sesión', 'error');
                    setLoading(false);
                }
            } catch (err) {
                console.error('Error:', err);
                showMessage('Error de conexión. Verifica tu internet.', 'error');
                setLoading(false);
            }
        });

        // ============================================================
        // VALIDACIÓN EN TIEMPO REAL
        // ============================================================
        emailInput.addEventListener('input', () => {
            if (emailInput.value.trim() && !validateEmail(emailInput.value)) {
                emailInput.style.borderColor = '#ff6b6b';
            } else {
                emailInput.style.borderColor = '';
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value && !validatePassword(passwordInput.value)) {
                passwordInput.style.borderColor = '#ff6b6b';
            } else {
                passwordInput.style.borderColor = '';
            }
        });

        // ============================================================
        // VERIFICAR SESIÓN
        // ============================================================
        (function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                fetch(`${API_URL}/api/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.ok) {
                        if (isMobileDevice()) {
                            window.location.href = '/mobile/index.html';
                        } else {
                            window.location.href = '/feed.html';
                        }
                    }
                })
                .catch(() => {});
            }
        })();

        console.log('🔐 Vyn Social Login cargado');
        console.log('📱 Detección de móvil activa');
    </script>
</body>
</html>
